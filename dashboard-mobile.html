<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>JKK Monitor</title>
<script>
(function(){
  window.__jkkMapsReady = false;
  window.initMap = function(){
    window.__jkkMapsReady = true;
    if (typeof window.bootMap === 'function') window.bootMap();
  };
  var l=localStorage.getItem('jkktrackr_lang')||'ja';
  // 'uk' is valid for Maps API (Ukrainian); fall back to 'ja' for unsupported codes
  var ml = (l==='ja'||l==='en'||l==='uk') ? l : 'ja';
  document.documentElement.lang=l;
  var s=document.createElement('script');s.async=true;
  s.src='https://maps.googleapis.com/maps/api/js?key=AIzaSyBHw3d6FU73jXiJxUJoZ4MlDGu2CmhC4i8&libraries=places&language='+ml+'&callback=initMap';
  document.head.appendChild(s);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #18181a;
  --surface: #242426;
  --surface2: #2e2e30;
  --glass: rgba(28,28,30,0.82);
  --border: rgba(255,255,255,0.10);
  --text: #f0ede6;
  --muted: rgba(255,255,255,0.45);
  --accent: #5DCAA5;
  --accent-dim: rgba(93,202,165,0.15);
  --danger: #E24B4A;
  --radius: 18px;
  --nav-h: 64px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --font: 'DM Sans', system-ui, sans-serif;
}
html[data-theme="light"] {
  --bg: #f2f2f4;
  --surface: #ffffff;
  --surface2: #e8e8ea;
  --glass: rgba(242,242,244,0.90);
  --border: rgba(0,0,0,0.10);
  --text: #1a1a1a;
  --muted: rgba(0,0,0,0.45);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:var(--font);background:#000;color:var(--text);height:100dvh;overflow:hidden;overscroll-behavior:none;}
html[data-theme="light"] body{background:#d8d8da;}
a{color:var(--accent);text-decoration:none;}

/* Scrollbars */
*{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,0.15) transparent;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.28);}
html[data-theme="light"] *{scrollbar-color:rgba(0,0,0,0.20) transparent;}
html[data-theme="light"] ::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.20);}
html[data-theme="light"] ::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,0.35);}

/* ── Map ── */
#map{position:fixed;top:0;left:0;width:100vw;height:100dvh;z-index:0;}

/* ── Top bar ── */
.top-bar{
  position:fixed;top:0;left:0;right:0;z-index:40;
  padding:calc(var(--safe-t) + 10px) 14px 10px;
  background:var(--glass);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;
}
.top-bar-title{
  font-size:15px;font-weight:700;color:var(--text);
  letter-spacing:-.02em;white-space:nowrap;
}
.top-bar-title span{color:var(--accent);}
.view-chips{display:flex;gap:5px;flex:1;justify-content:center;}
.vc{
  padding:5px 10px;border-radius:20px;border:1px solid var(--border);
  background:none;color:var(--muted);font-size:11px;font-weight:600;
  font-family:var(--font);cursor:pointer;transition:all .15s;white-space:nowrap;
}
.vc.active{background:var(--accent);border-color:var(--accent);color:#0a2e24;}
.lang-select{
  background:none;border:1px solid rgba(255,255,255,0.15);border-radius:10px;
  color:rgba(255,255,255,0.85);font-size:11px;font-weight:700;font-family:var(--font);
  padding:3px 6px;cursor:pointer;width:52px;text-align:center;text-align-last:center;
  outline:none;transition:all .15s;flex-shrink:0;
}
.lang-select:hover{border-color:var(--accent);color:var(--accent);}
.lang-select option{background:#1e2124;color:#fff;}
.theme-btn{
  background:none;border:1px solid var(--border);border-radius:10px;
  color:var(--muted);width:30px;height:28px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;transition:all .15s;padding:0;
}
.theme-btn:hover{border-color:var(--accent);color:var(--accent);}
.theme-btn svg{width:15px;height:15px;stroke:currentColor;stroke-width:2;fill:none;}

/* ── Count pill ── */
.count-pill{
  position:fixed;top:calc(var(--safe-t) + 56px);left:50%;transform:translateX(-50%);
  z-index:39;background:var(--glass);backdrop-filter:blur(12px);
  border:1px solid var(--border);border-radius:20px;
  padding:3px 12px;font-size:11px;color:var(--muted);
  pointer-events:none;white-space:nowrap;
  transition:opacity .2s;
}

/* ── Bottom nav ── */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:40;
  height:calc(var(--nav-h) + var(--safe-b));
  padding-bottom:var(--safe-b);
  background:var(--glass);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--border);
  display:flex;align-items:stretch;
}
.nav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;background:none;border:none;cursor:pointer;
  color:var(--muted);font-size:9px;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;font-family:var(--font);transition:color .15s;padding:8px 0;
}
.nav-btn svg{width:22px;height:22px;stroke-width:1.8;}
.nav-btn.active{color:var(--accent);}
.nav-btn .badge{
  position:absolute;top:10px;background:var(--danger);color:#fff;
  font-size:9px;border-radius:8px;padding:1px 5px;min-width:16px;text-align:center;
}

/* ── Chat FAB ── */
.chat-fab{
  position:fixed;right:16px;bottom:calc(var(--nav-h) + var(--safe-b) + 14px);
  z-index:41;
  width:52px;height:52px;border-radius:50%;
  background:var(--accent);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 20px rgba(93,202,165,.45);
  transition:transform .15s,box-shadow .15s;
}
.chat-fab:active{transform:scale(.92);}
.chat-fab svg{width:24px;height:24px;stroke:#0a2e24;stroke-width:2;}

/* ── Sheet base ── */
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:var(--surface);
  border-radius:var(--radius) var(--radius) 0 0;
  border-top:1px solid var(--border);
  transform:translateY(100%);
  transition:transform .32s cubic-bezier(.4,0,.2,1);
  max-height:88dvh;display:flex;flex-direction:column;
}
.sheet.open{transform:translateY(0);}
.sheet-handle{
  width:36px;height:4px;border-radius:2px;
  background:rgba(255,255,255,0.2);
  margin:10px auto 0;flex-shrink:0;
}

/* ── Property sheet ── */
#prop-sheet{padding-bottom:calc(var(--nav-h) + var(--safe-b));}
.prop-sheet-head{
  display:flex;align-items:flex-start;gap:10px;
  padding:12px 16px 10px;flex-shrink:0;
}
.prop-sheet-name{font-size:14px;font-weight:700;flex:1;line-height:1.3;}
.prop-sheet-src{
  font-size:9px;font-weight:700;padding:2px 6px;border-radius:8px;
  text-transform:uppercase;letter-spacing:.05em;flex-shrink:0;margin-top:2px;
}
.prop-sheet-src.jkk{background:rgba(220,38,38,.18);color:#f87171;}
.prop-sheet-src.ur{background:rgba(58,134,255,.18);color:#7aadff;}
.star-btn{
  background:none;border:none;cursor:pointer;font-size:20px;color:var(--muted);
  flex-shrink:0;padding:2px;line-height:1;transition:color .15s, transform .1s;
}
.star-btn.saved{color:#FBBF24;}
.star-btn:active{transform:scale(1.25);}
.prop-sheet-meta{
  padding:0 16px 10px;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;
  flex-shrink:0;
}
.prop-sheet-meta strong{color:var(--text);font-weight:600;}
.prop-sheet-station{
  padding:0 16px 10px;font-size:12px;color:var(--muted);flex-shrink:0;
}
.prop-sheet-station span{color:var(--text);}
.prop-thumb{
  margin:0 16px 10px;border-radius:12px;overflow:hidden;cursor:pointer;
  flex-shrink:0;height:160px;background:var(--surface2);position:relative;
}
.prop-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.prop-thumb-none{
  height:160px;margin:0 16px 10px;border-radius:12px;
  background:var(--surface2);display:flex;align-items:center;justify-content:center;
  font-size:32px;flex-shrink:0;
}

/* Sheet tabs */
.sheet-tabs{display:flex;border-top:1px solid var(--border);flex-shrink:0;}
.sheet-tab{
  flex:1;padding:10px 4px;background:none;border:none;cursor:pointer;
  color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;font-family:var(--font);transition:color .15s;
  border-bottom:2px solid transparent;
}
.sheet-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.sheet-tab-content{flex:1;overflow-y:auto;padding:12px 16px 8px;-webkit-overflow-scrolling:touch;}
.sheet-tab-pane{display:none;}
.sheet-tab-pane.active{display:block;}

/* Facility list */
.fac-list{display:flex;flex-direction:column;gap:6px;}
.fac-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 10px;background:var(--surface2);border-radius:10px;font-size:12px;
}
.fac-row-name{flex:1;color:var(--text);}
.fac-row-dist{color:var(--muted);font-size:11px;margin-left:8px;}
.fac-empty{color:var(--muted);font-size:12px;padding:8px 0;}

/* Photos grid */
.m-photos-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.m-photos-grid img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;cursor:pointer;}
#m-floorplan-grid{display:block;}
#m-floorplan-grid img{width:100%;height:auto;border-radius:10px;cursor:pointer;margin-bottom:6px;}

/* ── Full overlays (Chat, List) ── */
.full-overlay{
  position:fixed;inset:0;z-index:60;
  background:var(--bg);
  display:flex;flex-direction:column;
  transform:translateY(100%);
  transition:transform .32s cubic-bezier(.4,0,.2,1);
}
.full-overlay.open{transform:translateY(0);}
.overlay-header{
  display:flex;align-items:center;gap:10px;
  padding:calc(var(--safe-t) + 14px) 16px 12px;
  border-bottom:1px solid var(--border);
  background:var(--glass);
  backdrop-filter:blur(20px);
  flex-shrink:0;
}
.overlay-title{font-size:16px;font-weight:700;flex:1;}
.overlay-close{
  background:rgba(255,255,255,.08);border:none;color:var(--text);
  width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:18px;
  display:flex;align-items:center;justify-content:center;
}

/* List view */
.listing-list{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch;}
.m-listing-card{
  background:var(--surface);border:1px solid var(--border);border-radius:14px;
  overflow:hidden;cursor:pointer;display:flex;align-items:stretch;
  transition:border-color .15s;
}
.m-listing-card:active{border-color:var(--accent);}
.m-card-thumb{width:88px;flex-shrink:0;background:var(--surface2);position:relative;min-height:80px;}
.m-card-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.m-card-thumb-none{width:100%;height:100%;min-height:80px;display:flex;align-items:center;justify-content:center;font-size:24px;}
.m-card-body{flex:1;padding:10px 12px;min-width:0;display:flex;flex-direction:column;gap:3px;}
.m-card-name{font-size:12px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.m-card-rent{font-size:14px;font-weight:700;color:var(--text);}
.m-card-meta{font-size:11px;color:var(--muted);}
.m-card-src{font-size:9px;font-weight:700;padding:2px 5px;border-radius:6px;display:inline-block;margin-top:2px;}
.m-card-src.jkk{background:rgba(220,38,38,.18);color:#f87171;}
.m-card-src.ur{background:rgba(58,134,255,.18);color:#7aadff;}
.m-card-star{padding:10px 12px;display:flex;align-items:center;font-size:18px;color:var(--muted);flex-shrink:0;}
.m-card-star.saved{color:#FBBF24;}

/* Chat */
#chat-overlay{padding-bottom:var(--safe-b);}
.chat-thread{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch;}
.cm{display:flex;gap:8px;max-width:88%;word-break:break-word;}
.cm--user{align-self:flex-end;flex-direction:row-reverse;}
.cm--assistant{align-self:flex-start;}
.cb{padding:9px 13px;border-radius:18px;font-size:13px;line-height:1.5;}
.cb--user{background:var(--accent);color:#0a2e24;border-radius:18px 18px 4px 18px;}
.cb--assistant{background:var(--surface2);color:var(--text);border-radius:18px 18px 18px 4px;}
.chat-input-row{
  display:flex;gap:8px;align-items:flex-end;
  padding:10px 12px;border-top:1px solid var(--border);
  background:var(--glass);backdrop-filter:blur(20px);flex-shrink:0;
}
.m-chat-input{
  flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:22px;
  color:var(--text);font-size:14px;font-family:var(--font);
  padding:10px 16px;resize:none;max-height:120px;overflow-y:auto;outline:none;
  transition:border-color .15s;line-height:1.4;
}
.m-chat-input:focus{border-color:rgba(93,202,165,.5);}
.m-chat-send{
  width:40px;height:40px;border-radius:50%;background:var(--accent);border:none;
  cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  transition:transform .12s;
}
.m-chat-send:active{transform:scale(.88);}
.m-chat-send svg{width:18px;height:18px;stroke:#0a2e24;stroke-width:2.5;}
.typing-dots{display:flex;gap:4px;padding:4px 2px;}
.typing-dots span{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:dot .9s infinite;}
.typing-dots span:nth-child(2){animation-delay:.15s;}
.typing-dots span:nth-child(3){animation-delay:.3s;}
@keyframes dot{0%,80%,100%{transform:scale(.8);opacity:.4}40%{transform:scale(1.1);opacity:1}}

/* Chat listing pills */
.chat-listings-row{display:flex;gap:8px;overflow-x:auto;padding:4px 0;scrollbar-width:none;}
.chat-listings-row::-webkit-scrollbar{display:none;}
.chat-card-pill{
  flex-shrink:0;width:130px;background:var(--surface);border:1px solid var(--border);
  border-radius:12px;overflow:hidden;cursor:pointer;transition:border-color .15s;
}
.chat-card-pill:active{border-color:var(--accent);}
.chat-card-pill img{width:100%;height:68px;object-fit:cover;background:var(--surface2);}
.chat-card-pill-info{padding:6px 8px;}
.chat-card-pill-name{font-size:10px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.chat-card-pill-meta{font-size:10px;color:var(--muted);}

/* Filter sheet */
#filter-sheet{padding-bottom:calc(var(--nav-h) + var(--safe-b));max-height:80dvh;}
.filter-body{flex:1;overflow-y:auto;padding:12px 16px;-webkit-overflow-scrolling:touch;}
.filter-section{margin-bottom:16px;}
.filter-label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.filter-chips{display:flex;flex-wrap:wrap;gap:5px;}
.fchip{
  padding:5px 11px;border-radius:20px;border:1px solid var(--border);
  background:none;color:var(--muted);font-size:11px;font-weight:600;
  font-family:var(--font);cursor:pointer;transition:all .12s;
}
.fchip.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);}
.filter-row{display:flex;gap:8px;margin-bottom:8px;}
.filter-input{
  flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:10px;
  color:var(--text);font-size:13px;font-family:var(--font);padding:8px 12px;outline:none;
  transition:border-color .15s;
}
.filter-input:focus{border-color:rgba(93,202,165,.4);}
.filter-apply{
  width:100%;padding:13px;background:var(--accent);border:none;border-radius:12px;
  color:#0a2e24;font-size:14px;font-weight:700;font-family:var(--font);cursor:pointer;
  margin-top:8px;transition:opacity .15s;
}
.filter-apply:active{opacity:.8;}

/* Lightbox */
.lightbox{
  position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.95);
  display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);
}
.lightbox.open{transform:none;}
.lightbox-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(var(--safe-t) + 14px) 16px 10px;flex-shrink:0;
}
.lightbox-counter{font-size:13px;color:rgba(255,255,255,.5);}
.lightbox-close{background:rgba(255,255,255,.12);border:none;color:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:20px;}
.lightbox-img-wrap{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:0 8px;position:relative;}
.lightbox-img-wrap img{max-width:100%;max-height:100%;object-fit:contain;display:block;border-radius:8px;touch-action:pinch-zoom;}
.lightbox-type{position:absolute;bottom:8px;left:20px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;padding:2px 8px;border-radius:10px;text-transform:uppercase;}
.lightbox-thumbs{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;flex-shrink:0;scrollbar-width:none;padding-bottom:calc(10px + var(--safe-b));}
.lightbox-thumbs::-webkit-scrollbar{display:none;}
.lb-thumb{width:52px;height:38px;object-fit:cover;border-radius:5px;cursor:pointer;opacity:.45;border:2px solid transparent;flex-shrink:0;}
.lb-thumb.active{opacity:1;border-color:var(--accent);}
.lightbox-nav{
  position:absolute;top:50%;transform:translateY(-50%);
  background:rgba(255,255,255,.12);border:none;color:#fff;
  width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:20px;z-index:1;
}
.lightbox-nav.prev{left:8px;}
.lightbox-nav.next{right:8px;}

/* Auth modal */
.modal-overlay{
  position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.7);
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal-box{
  width:100%;background:var(--surface);border-radius:var(--radius) var(--radius) 0 0;
  padding:24px 20px calc(24px + var(--safe-b));
  border-top:1px solid var(--border);
}
.modal-title{font-size:18px;font-weight:700;margin-bottom:16px;}
.modal-input{
  width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;
  color:var(--text);font-size:15px;font-family:var(--font);padding:12px 14px;outline:none;
  margin-bottom:10px;transition:border-color .15s;
}
.modal-input:focus{border-color:rgba(93,202,165,.5);}
.modal-btn{
  width:100%;padding:14px;background:var(--accent);border:none;border-radius:12px;
  color:#0a2e24;font-size:15px;font-weight:700;font-family:var(--font);cursor:pointer;margin-bottom:10px;
}
.modal-link{font-size:13px;color:var(--accent);text-align:center;cursor:pointer;display:block;padding:4px;}
.modal-err{font-size:12px;color:#f87171;margin-bottom:8px;}

/* Map marker override for mobile */
.gm-style-iw{display:none!important;}

/* Misc */
.hidden{display:none!important;}
.spin{animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="map"></div>

<div class="count-pill" id="count-pill">…</div>

<!-- Top bar -->
<div class="top-bar">
  <div class="top-bar-title">JKK<span>.</span></div>
  <div class="view-chips">
    <button class="vc active" id="vc-all"      onclick="setViewMode('all')">All</button>
    <button class="vc"         id="vc-starred"  onclick="setViewMode('starred')">★</button>
    <button class="vc"         id="vc-filtered" onclick="setViewMode('filtered')">Filter</button>
  </div>
  <select id="lang-select" class="lang-select" onchange="setLang(this.value)">
    <option value="ja">🇯🇵 JP</option>
    <option value="en">🇬🇧 EN</option>

function t(k) {
  const s = STRINGS[k];
  if (!s) return k;
  return s[_lang] !== undefined ? s[_lang] : s.ja;
}

function wardLabel(ja) {
  if (_lang === 'en' || _lang === 'uk') {
    const en = WARD_EN[ja] || ja;
    return en.replace(/^(Yokohama|Kawasaki|Sagamihara) /, '');
  }
  return ja.replace(/^(横浜市|川崎市|相模原市)/, '');
}

// ── State ──────────────────────────────────────────────────────────────────
let map, _allListings=[], _markers={}, _filteredListings=[];
let _selectedId=null, _savedListings=new Set();
let _viewMode='all', _lang=localStorage.getItem('jkktrackr_lang')||'ja';
let _filterSources=new Set(['jkk','ur']);
let _filterLayouts=new Set(LAYOUTS);
let _filterWards=new Set(ALL_WARDS);
let _chatSessionId=localStorage.getItem('m_chatSessionId')||null;
let _chatBusy=false;
let _chatPendingIntent=null;
let AUTH={token:null,email:null};
let _lbImages=[], _lbIdx=0;

function authHeaders(){return AUTH.token?{'Content-Type':'application/json','Authorization':'Bearer '+AUTH.token}:{'Content-Type':'application/json'};}

// ── Map ────────────────────────────────────────────────────────────────────
window.bootMap = function bootMap(){
  if (map) return;
  const mapEl = document.getElementById('map');
  if (!mapEl) return;
  try {
    map = new google.maps.Map(mapEl, {
      center:{lat:35.680,lng:139.750}, zoom:11,
      gestureHandling:'greedy',
      styles:_darkMode ? darkMapStyle() : [],
      mapTypeControl:false, streetViewControl:false,
      fullscreenControl:false, zoomControl:false,
    });
    setTimeout(() => {
      google.maps.event.trigger(map, 'resize');
      map.setCenter({lat:35.680, lng:139.750});
    }, 300);
    loadListings();
    initAuth();
  } catch(e) { console.error('JKK: map init failed', e); }
};

// Race-safe: if Maps already fired before this script set window.bootMap
if (window.__jkkMapsReady) window.bootMap();

function markerIcon(source, selected, saved){
  const isUR = source==='ur';
  const fill = selected ? (isUR?'#1d4ed8':'#b91c1c') : (isUR?'#3a86ff':'#dc2626');
  const stroke = selected ? 'rgba(255,255,255,0.95)' : 'rgba(255,255,255,0.7)';
  const w = selected?32:26, h = Math.round(w*1.45), cx = w/2, cr = w*0.28;
  const inner = saved ? '#FCD34D' : 'rgba(255,255,255,0.88)';
  const py = (w*0.5).toFixed(1), ph = h.toFixed(0);
  const c1x = (cx - w*0.42).toFixed(1), c2x = (cx + w*0.42).toFixed(1);
  const w38 = (w*0.38).toFixed(1), w92 = (w*0.92).toFixed(1);
  const crStr = cr.toFixed(1);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${ph}" viewBox="0 0 ${w} ${ph}"><path d="M${cx} 1 C${c1x} 1 1 ${w38} 1 ${py} C1 ${w92} ${cx} ${ph} ${cx} ${ph} C${cx} ${ph} ${w-1} ${w92} ${w-1} ${py} C${w-1} ${w38} ${c2x} 1 ${cx} 1 Z" fill="${fill}" stroke="${stroke}" stroke-width="1.5"/><circle cx="${cx}" cy="${py}" r="${crStr}" fill="${inner}"/></svg>`;
  let url;
  try { url = 'data:image/svg+xml;base64,' + btoa(svg); }
  catch(e) { url = 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg); }
  return {
    url,
    scaledSize: new google.maps.Size(w, parseInt(ph)),
    anchor: new google.maps.Point(cx, parseInt(ph)),
  };
}

function applyMapFilters(){
  if(!map) return;
  const minRent=parseInt(document.getElementById('f-min-rent').value)||0;
  const maxRent=parseInt(document.getElementById('f-max-rent').value)||0;
  const minSize=parseFloat(document.getElementById('f-min-size').value)||0;
  const maxWalk=parseInt(document.getElementById('f-max-walk').value)||0;
  Object.values(_markers).forEach(e=>e.marker.setMap(null));
  _markers={};_filteredListings=[];
  _allListings.forEach(l=>{
    if(l.disappeared_at) return;
    if(_viewMode==='starred' && !_savedListings.has(l.id)) return;
    if(_viewMode==='filtered'){
      if(!_filterSources.has(l.source)) return;
      if(!_filterWards.has(l.ward)) return;
      if(!_filterLayouts.has(l.layout)) return;
      if(minRent>0 && l.rent<minRent) return;
      if(maxRent>0 && l.rent>maxRent) return;
      if(minSize>0 && l.size_m2<minSize) return;
      if(maxWalk>0 && (l.walk_min==null||l.walk_min>maxWalk)) return;
    }
    _filteredListings.push(l);
    if(!l.lat||!l.lng) return;
    try {
      const marker=new google.maps.Marker({
        position:{lat:l.lat,lng:l.lng},map,
        icon:markerIcon(l.source,false,_savedListings.has(l.id)),
        title:l.name,
      });
      marker.addListener('click',()=>selectListing(l.id));
      _markers[l.id]={marker,source:l.source,listing:l};
    } catch(e) { console.warn('Marker error', l.id, e); }
  });
  const pill=document.getElementById('count-pill');
  const total=_allListings.filter(l=>!l.disappeared_at).length;
  pill.textContent=_filteredListings.length+' / '+total;
}

function setViewMode(m){
  _viewMode=m;
  ['all','starred','filtered'].forEach(v=>{
    document.getElementById('vc-'+v)?.classList.toggle('active',v===m);
  });
  applyMapFilters();
  renderList();
}

async function loadListings(){
  try{
    const r=await fetch(`${API}/listings`,{headers:authHeaders()});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d=await r.json();
    _allListings=d.listings||[];
    applyMapFilters();
    renderList();
  }catch(e){ console.error('loadListings error',e); }
}

async function loadSaved(){
  if(!AUTH.token) return;
  try{
    const r=await fetch(`${API}/user/saved`,{headers:authHeaders()});
    if(!r.ok) return;
    const d=await r.json();
    _savedListings=new Set((d.saved||[]).map(s=>s.listing_id));
    Object.entries(_markers).forEach(([id,e])=>
      e.marker.setIcon(markerIcon(e.source,id===_selectedId,_savedListings.has(id))));
    renderList();
  }catch{}
}

// ── Select listing ─────────────────────────────────────────────────────────
function selectListing(id){
  if(_selectedId&&_markers[_selectedId]){
    const e=_markers[_selectedId];
    e.marker.setIcon(markerIcon(e.source,false,_savedListings.has(_selectedId)));
  }
  _selectedId=id;
  const entry=_markers[id];
  if(entry){
    entry.marker.setIcon(markerIcon(entry.source,true,_savedListings.has(id)));
    map.panTo(entry.marker.getPosition());
    map.setZoom(15);
  }
  openPropSheet(id);
  closeOverlay('list-overlay');
  document.getElementById('nav-map').classList.add('active');
  document.getElementById('nav-list').classList.remove('active');
}

function openPropSheet(id){
  const l=_allListings.find(x=>x.id===id);
  if(!l) return;
  const rent=l.rent?'¥'+Number(l.rent).toLocaleString():'—';
  document.getElementById('ps-name').textContent=l.name||'—';
  document.getElementById('ps-src').innerHTML=`<span class="prop-sheet-src ${l.source}">${l.source==='ur'?'UR':'公社'}</span>`;
  document.getElementById('ps-meta').innerHTML=`<strong>${rent}</strong> · ${l.layout||'—'} · ${l.size_m2?l.size_m2+'m²':'—'}`;
  const sta=l.nearest_station?`<span>${l.nearest_station}</span>${l.walk_min?' 徒歩<span style="color:var(--text)">&nbsp;'+l.walk_min+'分</span>':''}` :'';
  document.getElementById('ps-station').innerHTML=sta?'🚉 '+sta:'';
  const starBtn=document.getElementById('ps-star');
  starBtn.classList.toggle('saved',_savedListings.has(id));
  const link=document.getElementById('ps-link');
  if(l.url){link.href=l.url;link.textContent=t('open_listing');link.style.display='';}
  else{link.style.display='none';}
  const wrap=document.getElementById('ps-thumb-wrap');
  if(l.thumbnail_url){
    const src=toAbsUrl(l.thumbnail_url);
    wrap.innerHTML=`<div class="prop-thumb" onclick="openSheetTab('photos')"><img src="${escHtml(src)}" onerror="this.parentElement.style.display='none'"></div>`;
  }else{
    wrap.innerHTML=`<div class="prop-thumb-none">🏠</div>`;
  }
  switchSheet('fac');
  loadSheetFacilities(id);
  const fpGrid=document.getElementById('m-floorplan-grid');
  const pGrid=document.getElementById('m-photos-grid');
  fpGrid.innerHTML='';pGrid.innerHTML='';
  delete fpGrid.dataset.loaded;delete pGrid.dataset.loaded;
  openSheet('prop-sheet');
}

function openSheetTab(tab){switchSheet(tab);}

function switchSheet(tab){
  document.querySelectorAll('.sheet-tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  document.querySelectorAll('.sheet-tab-pane').forEach(p=>p.classList.toggle('active',p.id==='stp-'+tab));
  if(tab==='fp'&&_selectedId) loadSheetPhotos(_selectedId,'m-floorplan-grid',['floor_plan']);
  if(tab==='photos'&&_selectedId) loadSheetPhotos(_selectedId,'m-photos-grid',['exterior','interior']);
}

async function loadSheetFacilities(id){
  const el=document.getElementById('m-fac-list');
  el.innerHTML='<div class="fac-empty">…</div>';
  try{
    const r=await fetch(`${API}/listings/${encodeURIComponent(id)}/facilities`,{headers:authHeaders()});
    const d=await r.json();
    const facs=d.facilities||[];
    if(!facs.length){el.innerHTML=`<div class="fac-empty">${t('fac_empty')}</div>`;return;}
    el.innerHTML=facs.slice(0,12).map(f=>`
      <div class="fac-row">
        <div class="fac-row-name">${escHtml(f.name||f.type||'')}</div>
        <div class="fac-row-dist">${f.distance_m?Math.round(f.distance_m)+'m':''}</div>
      </div>`).join('');
  }catch{el.innerHTML=`<div class="fac-empty">${t('fac_empty')}</div>`;}
}

async function loadSheetPhotos(id,gridId,types){
  const grid=document.getElementById(gridId);
  if(!grid||grid.dataset.loaded===id) return;
  grid.innerHTML=`<div style="color:var(--muted);font-size:12px;">…</div>`;
  try{
    const r=await fetch(`${API}/listings/${encodeURIComponent(id)}/images`,{headers:authHeaders()});
    const imgs=await r.json();
    const filtered=types?imgs.filter(i=>types.includes(i.type)):imgs;
    if(!filtered.length){grid.innerHTML=`<div style="color:var(--muted);font-size:12px;">${t('no_photos')}</div>`;return;}
    const norm=filtered.map(i=>({...i,url:toAbsUrl(i.url)}));
    grid.dataset.loaded=id;
    grid.innerHTML=norm.map((img,i)=>`<img src="${escHtml(img.url)}" data-type="${img.type||''}" onerror="this.style.opacity='.2'" onclick="openLightbox(${JSON.stringify(norm)},${i})">`).join('');
  }catch{grid.innerHTML=`<div style="color:var(--muted);font-size:12px;">${t('no_photos')}</div>`;}
}

// ── Lightbox ───────────────────────────────────────────────────────────────
function openLightbox(imgs,idx){
  _lbImages=imgs;_lbIdx=idx;
  document.getElementById('lightbox').classList.add('open');
  lbRender();
  document.addEventListener('keydown',lbKey);
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('open');
  document.removeEventListener('keydown',lbKey);
}
function lbKey(e){if(e.key==='Escape')closeLightbox();else if(e.key==='ArrowLeft')lbNav(-1);else if(e.key==='ArrowRight')lbNav(1);}
function lbNav(dir){_lbIdx=(_lbIdx+dir+_lbImages.length)%_lbImages.length;lbRender();}
function lbRender(){
  const img=_lbImages[_lbIdx];
  document.getElementById('lb-img').src=img.url;
  document.getElementById('lb-counter').textContent=`${_lbIdx+1} / ${_lbImages.length}`;
  document.getElementById('lb-type').textContent=(img.type||'').replace('_',' ');
  const thumbs=document.getElementById('lb-thumbs');
  thumbs.innerHTML=_lbImages.map((im,i)=>`<img class="lb-thumb${i===_lbIdx?' active':''}" src="${escHtml(im.url)}" onclick="lbNav(${i-_lbIdx})" onerror="this.style.display='none'">`).join('');
  thumbs.children[_lbIdx]?.scrollIntoView({inline:'nearest',block:'nearest'});
}

// ── Save / Toggle ──────────────────────────────────────────────────────────
async function toggleSave(id){
  if(!id) return;
  if(!AUTH.token){openAuthModal();return;}
  const was=_savedListings.has(id);
  if(was)_savedListings.delete(id);else _savedListings.add(id);
  const starBtn=document.getElementById('ps-star');
  if(starBtn&&_selectedId===id) starBtn.classList.toggle('saved',!was);
  if(_markers[id]){
    const e=_markers[id];
    e.marker.setIcon(markerIcon(e.source,id===_selectedId,!was));
  }
  renderList();
  try{
    await fetch(`${API}/user/saved/${encodeURIComponent(id)}`,{method:was?'DELETE':'POST',headers:authHeaders()});
  }catch{}
}

// ── List view ──────────────────────────────────────────────────────────────
function renderList(){
  const el=document.getElementById('listing-list');
  if(!el) return;
  const listings=_filteredListings.length?_filteredListings:_allListings.filter(l=>!l.disappeared_at);
  document.getElementById('list-title').textContent=t('list_title')+' ('+listings.length+')';
  el.innerHTML=listings.map(l=>{
    try {
      const rent=l.rent?'¥'+Number(l.rent).toLocaleString():'—';
      const src=toAbsUrl(l.thumbnail_url);
      const thumb=src?`<img src="${escHtml(src)}" loading="lazy" onerror="this.style.display='none'">`:`<div class="m-card-thumb-none">🏠</div>`;
      const saved=_savedListings.has(l.id);
      const ward=wardLabel(l.ward||'');
      return `<div class="m-listing-card" onclick="selectListing('${escHtml(l.id)}')">
        <div class="m-card-thumb">${thumb}</div>
        <div class="m-card-body">
          <div class="m-card-name">${escHtml(l.name||'')}</div>
          <div class="m-card-rent">${rent}</div>
          <div class="m-card-meta">${escHtml([l.layout,l.size_m2?l.size_m2+'m²':null,ward].filter(Boolean).join(' · '))}</div>
          ${l.nearest_station?`<div class="m-card-meta">🚉 ${escHtml(l.nearest_station)}${l.walk_min?' '+l.walk_min+'min':''}</div>`:''}
          <span class="m-card-src ${l.source}">${l.source==='ur'?'UR':'公社'}</span>
        </div>
        <div class="m-card-star${saved?' saved':''}" onclick="event.stopPropagation();toggleSave('${escHtml(l.id)}')">★</div>
      </div>`;
    } catch(e) { return ''; }
  }).join('');
}

// ── Filter sheet ───────────────────────────────────────────────────────────
function buildFilterChips(){
  const sc=document.getElementById('f-source-chips');
  if(sc) sc.innerHTML=['jkk','ur'].map(s=>`<button class="fchip${_filterSources.has(s)?' active':''}" onclick="toggleFilterChip(this,'source','${s}')">${s==='ur'?'UR':'公社'}</button>`).join('');
  const lc=document.getElementById('f-layout-chips');
  if(lc) lc.innerHTML=LAYOUTS.map(l=>`<button class="fchip${_filterLayouts.has(l)?' active':''}" onclick="toggleFilterChip(this,'layout','${escHtml(l)}')">${escHtml(l)}</button>`).join('');
  const wc=document.getElementById('f-ward-chips');
  if(wc) wc.innerHTML=ALL_WARDS.map(w=>`<button class="fchip${_filterWards.has(w)?' active':''}" onclick="toggleFilterChip(this,'ward','${escHtml(w)}')">${escHtml(wardLabel(w))}</button>`).join('');
}
function toggleFilterChip(btn,type,val){
  btn.classList.toggle('active');
  const set=type==='source'?_filterSources:type==='layout'?_filterLayouts:_filterWards;
  set.has(val)?set.delete(val):set.add(val);
}
function applyFilterSheet(){
  if(_viewMode!=='filtered') setViewMode('filtered');
  else applyMapFilters();
  renderList();
  closeSheet('filter-sheet');
}

// ── Chat ───────────────────────────────────────────────────────────────────
function chatAutoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,120)+'px';}
function chatKeydown(e){if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();chatSend();}}

function chatCardSelect(id){
  selectListing(id);
  if(_chatPendingIntent){
    const intent=_chatPendingIntent;
    _chatPendingIntent=null;
    setTimeout(()=>{
      const inp=document.getElementById('chat-input');
      if(inp){inp.value=intent;chatSend();}
    },150);
  }
}

function _chatAppend(role,text,ids){
  const thread=document.getElementById('chat-thread');
  const wrap=document.createElement('div');
  wrap.className=`cm cm--${role}`;
  if(text){
    const b=document.createElement('div');
    b.className=`cb cb--${role}`;
    b.textContent=text;
    wrap.appendChild(b);
  }
  if(ids&&ids.length){
    const row=document.createElement('div');
    row.className='chat-listings-row';
    ids.forEach(id=>{
      const l=_allListings.find(x=>x.id===id);
      if(!l) return;
      const src=toAbsUrl(l.thumbnail_url);
      const pill=document.createElement('div');
      pill.className='chat-card-pill';
      pill.onclick=()=>chatCardSelect(id);
      pill.innerHTML=`${src?`<img src="${escHtml(src)}" onerror="this.style.display='none'">`:'<div style="height:68px;background:var(--surface2);display:flex;align-items:center;justify-content:center;">🏠</div>'}
        <div class="chat-card-pill-info">
          <div class="chat-card-pill-name">${escHtml(l.name||'')}</div>
          <div class="chat-card-pill-meta">${l.rent?'¥'+Number(l.rent).toLocaleString():''} ${l.layout||''}</div>
        </div>`;
      row.appendChild(pill);
    });
    if(row.children.length) wrap.appendChild(row);
  }
  thread.appendChild(wrap);
  thread.scrollTop=thread.scrollHeight;
}

function _chatShowTyping(){
  const thread=document.getElementById('chat-thread');
  const el=document.createElement('div');
  el.className='cm cm--assistant';el.id='chat-typing';
  el.innerHTML=`<div class="cb cb--assistant"><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
  thread.appendChild(el);thread.scrollTop=thread.scrollHeight;
}
function _chatRemoveTyping(){document.getElementById('chat-typing')?.remove();}

async function chatSend(){
  const input=document.getElementById('chat-input');
  const msg=(input.value||'').trim();
  if(!msg||_chatBusy) return;
  input.value='';chatAutoResize(input);
  _chatBusy=true;
  _chatAppend('user',msg,[]);
  _chatShowTyping();
  try{
    const r=await fetch(`${API}/chat`,{
      method:'POST',headers:authHeaders(),
      body:JSON.stringify({message:msg,session_id:_chatSessionId,open_listing_id:_selectedId||null}),
    });
    const d=await r.json();
    _chatRemoveTyping();
    if(!r.ok) throw new Error(d.error||r.status);
    _chatSessionId=d.session_id;
    localStorage.setItem('m_chatSessionId',_chatSessionId);
    _chatAppend('assistant',d.response||'',d.listing_ids||[]);
    (d.actions||[]).forEach(chatExecAction);
  }catch(e){_chatRemoveTyping();_chatAppend('assistant','Error: '+e.message,[]);}
  finally{_chatBusy=false;}
}

function chatExecAction(action){
  if(action.type==='show_images'){
    const imgs=(action.images||[]).map(i=>({...i,url:toAbsUrl(i.url)}));
    if(imgs.length) openLightbox(imgs,0);
  } else if(action.type==='await_card_pick'){
    _chatPendingIntent=action.pending_message||null;
  } else if(action.type==='select_listing'){
    if(action.listing_id) selectListing(action.listing_id);
  } else if(action.type==='center_map'){
    if(map && action.lat!=null && action.lng!=null){
      map.panTo({lat:action.lat,lng:action.lng});
      map.setZoom(action.zoom||15);
    }
  } else if(action.type==='get_commute_client'){
    // Transit commute not supported in mobile (no DirectionsRenderer setup)
    _chatAppend('assistant','Transit commute is only available on the desktop version.',[]);
  } else if(action.type==='show_driving_route'){
    if(map && action.lat!=null && action.lng!=null){
      map.panTo({lat:action.lat,lng:action.lng});
      map.setZoom(14);
    }
  } else if(action.type==='set_map_filter'){
    if(action.min_rent!=null) document.getElementById('f-min-rent').value=action.min_rent||'';
    if(action.max_rent!=null) document.getElementById('f-max-rent').value=action.max_rent||'';
    if(action.min_size!=null) document.getElementById('f-min-size').value=action.min_size||'';
    if(action.max_walk!=null) document.getElementById('f-max-walk').value=action.max_walk||'';
    if(action.source==='jkk') _filterSources=new Set(['jkk']);
    else if(action.source==='ur') _filterSources=new Set(['ur']);
    else if(action.source==='both') _filterSources=new Set(['jkk','ur']);
    buildFilterChips();
    applyMapFilters();
  } else if(action.type==='save_listings'){
    (action.listing_ids||[]).forEach(id=>_savedListings.add(id));
    Object.entries(_markers).forEach(([id,e])=>e.marker.setIcon(markerIcon(e.source,id===_selectedId,_savedListings.has(id))));
    renderList();
    if(AUTH.token) loadSaved();
  } else if(action.type==='remove_listings'){
    (action.listing_ids||[]).forEach(id=>_savedListings.delete(id));
    Object.entries(_markers).forEach(([id,e])=>e.marker.setIcon(markerIcon(e.source,id===_selectedId,_savedListings.has(id))));
    renderList();
  }
}

// ── Navigation ─────────────────────────────────────────────────────────────
function showNav(tab){
  ['map','list','filter','account','chat'].forEach(n=>{
    document.getElementById('nav-'+n)?.classList.toggle('active',n===tab);
  });
  if(tab==='list'){openOverlay('list-overlay');renderList();}
  else if(tab==='chat'){openOverlay('chat-overlay');setTimeout(()=>document.getElementById('chat-input')?.focus(),300);}
  else if(tab==='filter'){openSheet('filter-sheet');}
  else if(tab==='account'){
    if(AUTH.token) alert(AUTH.email||''); else openAuthModal();
  } else {
    closeOverlay('list-overlay');closeOverlay('chat-overlay');closeSheet('filter-sheet');
  }
}

function openSheet(id){document.getElementById(id)?.classList.add('open');}
function closeSheet(id){document.getElementById(id)?.classList.remove('open');}
function openOverlay(id){document.getElementById(id)?.classList.add('open');}
function closeOverlay(id){
  document.getElementById(id)?.classList.remove('open');
  ['nav-map','nav-list','nav-filter','nav-account'].forEach(n=>{
    document.getElementById(n)?.classList.remove('active');
  });
  document.getElementById('nav-map')?.classList.add('active');
}

// ── Auth ───────────────────────────────────────────────────────────────────
let _authMode='login';
function openAuthModal(){document.getElementById('auth-modal').classList.add('open');}
function closeAuthModal(){document.getElementById('auth-modal').classList.remove('open');}
function toggleAuthMode(){
  _authMode=_authMode==='login'?'register':'login';
  document.getElementById('auth-title').textContent=_authMode==='login'?'ログイン':'アカウント作成';
  document.getElementById('auth-pw2').classList.toggle('hidden',_authMode==='login');
  document.querySelector('.modal-btn').textContent=_authMode==='login'?'ログイン':'登録';
  document.getElementById('auth-switch').textContent=_authMode==='login'?'アカウント作成':'ログインへ';
  document.getElementById('auth-err').classList.add('hidden');
}
async function authSubmit(){
  const email=document.getElementById('auth-email').value.trim();
  const pw=document.getElementById('auth-pw').value;
  const errEl=document.getElementById('auth-err');
  errEl.classList.add('hidden');
  if(!email||!pw){errEl.textContent='メールとパスワードを入力してください';errEl.classList.remove('hidden');return;}
  try{
    const ep=_authMode==='login'?'/api/auth/login':'/api/auth/register';
    const body=_authMode==='login'?{email,password:pw}:{email,password:pw,display_name:email.split('@')[0]};
    const r=await fetch(API.replace('/api','')+ep,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json();
    if(!r.ok){errEl.textContent=d.error||'エラー';errEl.classList.remove('hidden');return;}
    AUTH={token:d.token,email:d.email};
    localStorage.setItem('jwt_token',d.token);
    localStorage.setItem('jwt_email',d.email);
    updateAuthUI();closeAuthModal();loadSaved();
  }catch(e){errEl.textContent=e.message;errEl.classList.remove('hidden');}
}

// ── Helpers ────────────────────────────────────────────────────────────────
function escHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ── Dark map style ─────────────────────────────────────────────────────────
function darkMapStyle(){
  return[{elementType:'geometry',stylers:[{color:'#1e1e22'}]},{elementType:'labels.text.stroke',stylers:[{color:'#1e1e22'}]},{elementType:'labels.text.fill',stylers:[{color:'#888'}]},{featureType:'road',elementType:'geometry',stylers:[{color:'#2c2c30'}]},{featureType:'road.arterial',elementType:'geometry',stylers:[{color:'#2c2c30'}]},{featureType:'road.highway',elementType:'geometry',stylers:[{color:'#383838'}]},{featureType:'water',elementType:'geometry',stylers:[{color:'#17263c'}]},{featureType:'poi',elementType:'geometry',stylers:[{color:'#252528'}]},{featureType:'transit.station',elementType:'labels.text.fill',stylers:[{color:'#5DCAA5'}]},{featureType:'landscape',elementType:'geometry',stylers:[{color:'#202024'}]}];
}

// ── Theme ──────────────────────────────────────────────────────────────────
let _darkMode = true;
const _moonSvg = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
const _sunSvg  = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';

function applyTheme(dark){
  _darkMode = dark;
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  const icon = document.getElementById('theme-icon');
  if(icon) icon.innerHTML = dark ? _moonSvg : _sunSvg;
  if(map) map.setOptions({styles: dark ? darkMapStyle() : []});
  localStorage.setItem('jkktrackr_theme', dark ? 'dark' : 'light');
}

function toggleTheme(){ applyTheme(!_darkMode); }

// ── Boot (independent of Maps) ─────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  const savedTheme = localStorage.getItem('jkktrackr_theme') || 'dark';
  applyTheme(savedTheme !== 'light');
  applyLang();
  buildFilterChips();
});

// ── Swipe to close prop sheet ──────────────────────────────────────────────
(()=>{
  const sheet=document.getElementById('prop-sheet');
  let startY=0,isDragging=false;
  sheet.addEventListener('touchstart',e=>{
    if(e.target.closest('.sheet-tab-content')) return;
    startY=e.touches[0].clientY;isDragging=true;
  },{passive:true});
  sheet.addEventListener('touchmove',e=>{
    if(!isDragging) return;
    const dy=e.touches[0].clientY-startY;
    if(dy>0) sheet.style.transform=`translateY(${dy}px)`;
  },{passive:true});
  sheet.addEventListener('touchend',e=>{
    if(!isDragging) return;
    isDragging=false;
    const dy=e.changedTouches[0].clientY-startY;
    sheet.style.transform='';
    if(dy>80){
      sheet.classList.remove('open');
      if(_selectedId&&_markers[_selectedId]){
        const en=_markers[_selectedId];
        en.marker.setIcon(markerIcon(en.source,false,_savedListings.has(_selectedId)));
      }
      _selectedId=null;
    }
  });
