<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JKK Stats</title>
<script>
(function(){
  var s = document.createElement('script'); s.async = true;
  s.src = 'https://maps.googleapis.com/maps/api/js?key=AIzaSyBHw3d6FU73jXiJxUJoZ4MlDGu2CmhC4i8&callback=_mapsReady';
  document.head.appendChild(s);
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap');
  :root {
    --bg:#f6f5f0;--surface:#fff;--rail-bg:#27272b;--surface2:#f0ede6;
    --border:rgba(0,0,0,.1);--text:#1a1a18;--muted:#6b6b66;
    --accent:#1D9E75;--accent-light:#E1F5EE;--danger:#E24B4A;--warn:#EF9F27;
    --radius:10px;--font:'DM Sans',system-ui,sans-serif;--mono:'DM Mono',monospace;
  }
  @media(prefers-color-scheme:dark){:root{
    --bg:#18181a;--surface:#242426;--surface2:#2e2e30;--border:rgba(255,255,255,.1);
    --text:#f0ede6;--muted:#9a9a94;--accent:#5DCAA5;--accent-light:#04342C;
  }}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;}

  /* topbar */
  .topbar{display:grid;grid-template-columns:38px 1fr;height:38px;position:sticky;top:0;z-index:16;}
  .topbar-rail{background:var(--rail-bg);display:flex;align-items:center;justify-content:center;border-bottom:1px solid rgba(255,255,255,.07);}
  .topbar-main{background:var(--rail-bg);border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:10px;padding:0 1.2rem;}
  .topbar-title{font-size:13px;font-weight:600;letter-spacing:-.02em;color:rgba(255,255,255,.85);flex-shrink:0;}
  .dot{width:22px;height:22px;background:var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;font-weight:700;}
  .dev-badge{font-size:9px;font-weight:700;background:rgba(239,159,39,.2);color:var(--warn);border:1px solid rgba(239,159,39,.3);border-radius:4px;padding:1px 5px;letter-spacing:.04em;flex-shrink:0;}
  .topbar-btn{background:none;border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:2px 9px;font-size:10px;color:rgba(255,255,255,.45);cursor:pointer;font-family:var(--font);text-decoration:none;transition:all .15s;white-space:nowrap;display:flex;align-items:center;}
  .topbar-btn:hover{border-color:var(--accent);color:var(--accent);}
  .topbar-status{font-size:11px;color:rgba(255,255,255,.3);margin-left:auto;white-space:nowrap;}

  /* layout */
  .layout{display:grid;grid-template-columns:38px 1fr;min-height:calc(100vh - 38px);}
  .left-rail{background:var(--rail-bg);border-right:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:4px;}
  .rail-icon{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .12s;color:rgba(255,255,255,.35);}
  .rail-icon:hover,.rail-icon.active{background:rgba(255,255,255,.08);color:var(--accent);}
  .rail-icon svg{width:15px;height:15px;}
  .main{padding:18px 22px;overflow-y:auto;height:calc(100vh - 38px);}
  .main.map-mode{padding:0;overflow:hidden;}

  /* cards */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:20px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;}
  .card-label{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;}
  .card-value{font-size:20px;font-weight:600;font-family:var(--mono);line-height:1;}
  .card-sub{font-size:11px;color:var(--muted);margin-top:3px;}

  /* section */
  .section-header{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
  .section-title{font-size:13px;font-weight:600;}
  .section-sub{font-size:11px;color:var(--muted);}

  /* charts */
  .charts-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px;}
  .chart-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;}
  .chart-title{font-size:11px;font-weight:600;color:var(--text);margin-bottom:10px;}
  @media(max-width:760px){.charts-row{grid-template-columns:1fr;}}

  /* map */
  .map-wrap{position:relative;width:100%;height:calc(100vh - 38px);}
  #stats-map{width:100%;height:100%;}
  .map-legend-overlay{
    position:absolute;bottom:28px;left:10px;z-index:5;
    background:rgba(0,0,0,.62);backdrop-filter:blur(6px);
    border-radius:8px;padding:8px 10px;min-width:150px;
    font-size:10px;color:rgba(255,255,255,.8);
  }
  .map-legend-bar{height:6px;border-radius:3px;margin:5px 0 3px;background:linear-gradient(to right,#3B82F6,#FCD34D,#EF4444);}
  .map-legend-labels{display:flex;justify-content:space-between;font-size:9px;color:rgba(255,255,255,.5);font-family:var(--mono);}

  /* layer picker */
  .map-layer-pill{position:absolute;top:10px;right:10px;z-index:5;}
  .map-layer-btn{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.62);backdrop-filter:blur(6px);border:none;border-radius:8px;padding:6px 10px;color:rgba(255,255,255,.85);font-size:11px;font-family:var(--font);cursor:pointer;white-space:nowrap;}
  .map-layer-btn:hover{background:rgba(0,0,0,.78);}
  .map-layer-chevron{font-size:9px;color:rgba(255,255,255,.45);transition:transform .15s;}
  .map-layer-pill.open .map-layer-chevron{transform:rotate(180deg);}
  .map-layer-menu{display:none;position:absolute;top:calc(100% + 5px);right:0;background:rgba(22,22,24,.96);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1);border-radius:8px;overflow:hidden;min-width:170px;box-shadow:0 6px 24px rgba(0,0,0,.4);}
  .map-layer-pill.open .map-layer-menu{display:block;}
  .map-layer-opt{padding:8px 12px;font-size:11px;color:rgba(255,255,255,.65);cursor:pointer;transition:background .1s;display:flex;align-items:center;gap:8px;}
  .map-layer-opt:hover{background:rgba(255,255,255,.08);}
  .map-layer-opt.active{color:var(--accent);font-weight:600;}
  .map-layer-opt .opt-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,#3B82F6,#EF4444);}

  /* tables */
  .table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:18px;}
  .data-table{width:100%;border-collapse:collapse;font-size:11px;}
  .data-table th{padding:7px 10px;text-align:left;font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;background:var(--surface2);border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none;}
  .data-table th:hover{color:var(--accent);}
  .data-table td{padding:6px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  .data-table tr:last-child td{border-bottom:none;}
  .data-table tr:hover td{background:var(--surface2);}
  .mono{font-family:var(--mono);}
  .badge{display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:600;white-space:nowrap;font-family:var(--mono);}
  .badge-up{background:rgba(226,75,74,.12);color:var(--danger);}
  .badge-down{background:rgba(29,158,117,.12);color:var(--accent);}
  .badge-neu{background:var(--surface2);color:var(--muted);}

  /* model metrics row */
  .metrics-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
  .metric-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;text-align:center;}
  .metric-val{font-size:22px;font-weight:600;font-family:var(--mono);}
  .metric-label{font-size:10px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.05em;}

  /* table controls */
  .tbl-ctrl{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--surface2);border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .tbl-ctrl select,.tbl-ctrl input{background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:11px;font-family:var(--font);padding:3px 7px;outline:none;}
  .tbl-ctrl input{width:140px;}
  .tbl-ctrl input::placeholder{color:var(--muted);}

  /* loading */
  .loading{display:flex;align-items:center;justify-content:center;padding:48px;color:var(--muted);font-size:13px;gap:8px;}
  .spinner{width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .bar-row{display:flex;align-items:center;gap:6px;margin-bottom:5px;font-size:11px;}
  .bar-label{width:160px;flex-shrink:0;text-align:right;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bar-track{flex:1;height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:4px;background:var(--accent);}
  .bar-fill.neg{background:var(--danger);}
  .bar-val{width:52px;flex-shrink:0;font-family:var(--mono);font-size:10px;color:var(--muted);}

  /* lang selector */
  .lang-select{background:none;border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:2px 6px;font-size:10px;color:rgba(255,255,255,.45);cursor:pointer;font-family:var(--font);outline:none;margin-left:auto;}
  .lang-select:hover{border-color:var(--accent);color:var(--accent);}
  .lang-select option{background:#27272b;color:#fff;}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-rail"><div class="dot">S</div></div>
  <div class="topbar-main">
    <span class="topbar-title" data-i18n="stats_title">Stats</span>
    <span class="dev-badge">DEV</span>
    <a class="topbar-btn" href="dashboard.html" data-i18n="back_dashboard">← Dashboard</a>
    <span class="topbar-status" id="status-label" data-i18n="loading">読み込み中…</span>
    <select class="lang-select" id="lang-select" onchange="setLang(this.value)">
      <option value="ja">🇯🇵 JP</option>
      <option value="en">🇬🇧 EN</option>
      <option value="uk">🇺🇦 UA</option>
    </select>
  </div>
</div>

<div class="layout">
  <div class="left-rail">
    <div class="rail-icon active" data-i18n-title="section_map" onclick="showSection('map')">
      <svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 2C6.69 2 4 4.69 4 8c0 4.5 6 10 6 10s6-5.5 6-10c0-3.31-2.69-6-6-6zm0 8a2 2 0 110-4 2 2 0 010 4z"/></svg>
    </div>
    <div class="rail-icon" data-i18n-title="section_overview" onclick="showSection('overview')">
      <svg viewBox="0 0 20 20" fill="currentColor"><rect x="2" y="2" width="7" height="7" rx="1.5"/><rect x="11" y="2" width="7" height="7" rx="1.5"/><rect x="2" y="11" width="7" height="7" rx="1.5"/><rect x="11" y="11" width="7" height="7" rx="1.5"/></svg>
    </div>
    <div class="rail-icon" data-i18n-title="section_ward" onclick="showSection('ward')">
      <svg viewBox="0 0 20 20" fill="currentColor"><path d="M3 15h2V8H3v7zm4 0h2V5H7v10zm4 0h2v-5h-2v5zm4 0h2V2h-2v13z"/></svg>
    </div>
    <div class="rail-icon" data-i18n-title="section_ml" onclick="showSection('ml')">
      <svg viewBox="0 0 20 20" fill="currentColor"><path d="M2 10l4-6 4 4 4-5 4 3v10H2V10z"/></svg>
    </div>
  </div>

  <div class="main" id="main">
    <div class="loading"><div class="spinner"></div><span data-i18n="loading">読み込み中…</span></div>
  </div>
</div>

<script>
// ── i18n ─────────────────────────────────────────────────────────────────────
let _lang = localStorage.getItem('jkktrackr_lang') || 'ja';

const STRINGS = {
  // Topbar / nav
  stats_title:      { ja:'Stats',              en:'Stats',                  uk:'Статистика' },
  back_dashboard:   { ja:'← ダッシュボード',    en:'← Dashboard',           uk:'← Дашборд' },
  loading:          { ja:'読み込み中…',         en:'Loading…',              uk:'Завантаження…' },
  error_server:     { ja:'サーバーに接続できません', en:'Server unreachable',  uk:'Сервер недоступний' },
  // Rail sections
  section_map:      { ja:'ヒートマップ',        en:'Heat Map',              uk:'Теплокарта' },
  section_overview: { ja:'概要',               en:'Overview',              uk:'Огляд' },
  section_ward:     { ja:'区別分析',            en:'Ward Analysis',         uk:'Аналіз районів' },
  section_ml:       { ja:'ML価格予測',         en:'ML Prediction',         uk:'ML Прогноз' },
  // Map overlay
  map_rpsq_label:   { ja:'㎡単価 (円/㎡/月)',  en:'Avg ¥/m² (per month)',  uk:'Сер. ¥/м² (на місяць)' },
  map_hint:         { ja:'クリックで詳細 · 灰色=データなし', en:'Click for details · grey=no data', uk:'Клік для деталей · сірий=немає даних' },
  map_rpsq:         { ja:'㎡単価',             en:'¥/m²',                  uk:'¥/м²' },
  map_avg_rent:     { ja:'平均家賃',            en:'Avg Rent',              uk:'Сер. оренда' },
  map_count:        { ja:'物件数',              en:'Listings',              uk:'Оголошень' },
  // Overview cards
  card_listings:    { ja:'物件数',              en:'Listings',              uk:'Оголошень' },
  card_avg_rent:    { ja:'平均家賃',            en:'Avg Rent',              uk:'Сер. оренда' },
  card_monthly:     { ja:'月額',               en:'/month',                uk:'/місяць' },
  card_avg_area:    { ja:'平均面積',            en:'Avg Area',              uk:'Сер. площа' },
  card_rpsq:        { ja:'平均㎡単価',          en:'Avg ¥/m²',              uk:'Сер. ¥/м²' },
  card_rpsq_sub:    { ja:'円/㎡/月',           en:'¥/m²/month',            uk:'¥/м²/міс' },
  card_wards:       { ja:'対象区市数',          en:'Wards',                 uk:'Районів' },
  card_wards_sub:   { ja:'区・市',              en:'wards & cities',        uk:'райони' },
  card_model_r2:    { ja:'モデル R²',          en:'Model R²',              uk:'Модель R²' },
  // Overview charts
  chart_rent_hist:  { ja:'家賃分布（¥千円）',   en:'Rent Distribution (¥k)', uk:'Розподіл оренди (¥тис)' },
  chart_rpsq_hist:  { ja:'㎡単価分布（円/㎡/月）', en:'¥/m² Distribution',  uk:'Розподіл ¥/м²' },
  chart_scatter:    { ja:'面積 vs 家賃',        en:'Area vs Rent',          uk:'Площа vs Оренда' },
  chart_layout:     { ja:'間取り × ソース',     en:'Layout × Source',       uk:'Планування × Джерело' },
  // Ward section
  ward_title:       { ja:'区・市別 家賃分析',   en:'Ward Rent Analysis',    uk:'Аналіз оренди по районах' },
  ward_global_avg:  { ja:'全体平均',            en:'Global Avg',            uk:'Загальне сер.' },
  ward_chart_title: { ja:'上位20区・市 平均㎡単価', en:'Top 20 Wards Avg ¥/m²', uk:'Топ-20 районів Сер. ¥/м²' },
  col_ward:         { ja:'区・市',              en:'Ward',                  uk:'Район' },
  col_count:        { ja:'件数',               en:'Count',                 uk:'Кількість' },
  col_avg_rent:     { ja:'平均家賃',            en:'Avg Rent',              uk:'Сер. оренда' },
  col_median:       { ja:'中央値',              en:'Median',                uk:'Медіана' },
  col_minmax:       { ja:'最小–最大',           en:'Min–Max',               uk:'Мін–Макс' },
  col_rpsq:         { ja:'㎡単価',             en:'¥/m²',                  uk:'¥/м²' },
  col_vs_global:    { ja:'全体比',              en:'vs Global',             uk:'vs Загальне' },
  col_avg_area:     { ja:'平均面積',            en:'Avg Area',              uk:'Сер. площа' },
  // ML section
  ml_title:         { ja:'ML価格予測モデル',    en:'ML Price Prediction Model', uk:'ML Модель прогнозу цін' },
  ml_method:        { ja:'重回帰（勾配降下法）', en:'Linear Regression (grad. descent)', uk:'Лінійна регресія (гр. спуск)' },
  ml_features_n:    { ja:(n)=>`${n} 特徴量`,   en:(n)=>`${n} features`,    uk:(n)=>`${n} ознак` },
  ml_trained_n:     { ja:(n)=>`${n} 件で学習`, en:(n)=>`trained on ${n}`,  uk:(n)=>`навчено на ${n}` },
  ml_r2:            { ja:'R² スコア',          en:'R² Score',              uk:'R² Оцінка' },
  ml_rmse:          { ja:'RMSE',              en:'RMSE',                  uk:'RMSE' },
  ml_mape:          { ja:'MAPE',              en:'MAPE',                  uk:'MAPE' },
  ml_importance:    { ja:'特徴量 重要度（正規化係数）', en:'Feature Importance (norm. weights)', uk:'Важливість ознак (норм. ваги)' },
  ml_pred_chart:    { ja:'実際 vs 予測（散布図）', en:'Actual vs Predicted', uk:'Факт vs Прогноз' },
  ml_ideal:         { ja:'理想線',             en:'Ideal',                 uk:'Ідеал' },
  ml_actual_axis:   { ja:'実際 (千円)',        en:'Actual (¥k)',           uk:'Факт (¥тис)' },
  ml_pred_axis:     { ja:'予測 (千円)',        en:'Predicted (¥k)',        uk:'Прогноз (¥тис)' },
  ml_filter_all:    { ja:'すべて',             en:'All',                   uk:'Усі' },
  ml_filter_ph:     { ja:'物件名・区市で絞込…', en:'Filter by name / ward…', uk:'Фільтр за назвою…' },
  col_src:          { ja:'元',                en:'Src',                   uk:'Дж.' },
  col_name:         { ja:'物件名',             en:'Name',                  uk:'Назва' },
  col_layout:       { ja:'間取',              en:'Layout',                uk:'Планув.' },
  col_area:         { ja:'面積',              en:'Area',                  uk:'Площа' },
  col_actual:       { ja:'実際',              en:'Actual',                uk:'Факт' },
  col_predicted:    { ja:'予測',              en:'Predicted',             uk:'Прогноз' },
  col_diff:         { ja:'差額',              en:'Diff',                  uk:'Різниця' },
  col_deviation:    { ja:'乖離率',             en:'Deviation',             uk:'Відхилення' },
  ml_no_results:    { ja:'該当なし',           en:'No results',            uk:'Немає результатів' },
  ml_not_ready:     { ja:'モデルが準備できていません', en:'Model not ready', uk:'Модель не готова' },
  view_props:       { ja:'物件を見る →',       en:'View Properties →',    uk:'Переглянути →' },
  layer_rpsq:       { ja:'平均㎡単価',          en:'Avg ¥/m²',             uk:'Сер. ¥/м²' },
  layer_count:      { ja:'物件集中度',          en:'Property Concentration', uk:'Концентрація' },
};

function t(key, ...args) {
  const s = STRINGS[key];
  if (!s) return key;
  const v = s[_lang] !== undefined ? s[_lang] : s.ja;
  return typeof v === 'function' ? v(...args) : v;
}

function applyLang() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = t(el.dataset.i18n);
    if (typeof v === 'string') el.textContent = v;
  });
  document.querySelectorAll('[data-i18n-title]').forEach(el => {
    const v = t(el.dataset.i18nTitle);
    if (typeof v === 'string') el.title = v;
  });
  const sel = document.getElementById('lang-select');
  if (sel) sel.value = _lang;
  // Re-render current section with new strings
  if (_listings.length) renderSection(_currentSection);
}

function setLang(lang) {
  if (_lang === lang) return;
  _lang = lang;
  localStorage.setItem('jkktrackr_lang', _lang);
  applyLang();
}

// ── Feature names (language-aware) ───────────────────────────────────────────
function featureNames() {
  const ja = ['面積 (m²)','徒歩分','築年数','駐車場','UR物件','同区平均㎡単価',
    'エアコン','床暖房','追い焚き','浴室乾燥','オートロック','温水洗浄便座','モニター付き','エレベーター',
    '1K','1DK','1LDK','2DK','2LDK','3DK','3LDK'];
  const en = ['Area (m²)','Walk (min)','Building Age','Parking','UR Property','Ward Avg ¥/m²',
    'AC','Floor Heating','Reheat Bath','Bath Dryer','Auto-Lock','Bidet','Video Intercom','Elevator',
    '1K','1DK','1LDK','2DK','2LDK','3DK','3LDK'];
  const uk = ['Площа (м²)','Хода (хв)','Вік будинку','Паркінг','UR Нерухомість','Сер. ¥/м² району',
    'Кондиц.','Тепла підлога','Підігрів ванни','Сушка ванни','Автозамок','Бідет','Відеодомофон','Ліфт',
    '1K','1DK','1LDK','2DK','2LDK','3DK','3LDK'];
  return { ja, en, uk }[_lang] || en;
}

// ─────────────────────────────────────────────────────────────────────────────
const API       = 'https://jkk-monitor.duckdns.org/api';
const TOPO_BASE = 'https://raw.githubusercontent.com/smartnews-smri/japan-topography/main/data/municipality/geojson/s0010/';
const TOPO_FILES = ['N03-21_13_210101.json','N03-21_14_210101.json','N03-21_11_210101.json','N03-21_12_210101.json'];

let _listings = [], _wardStats = {}, _globalAvg = 0;
let _walkMean = 10, _ageMean = 20;
let _model = null;
let _currentSection = 'map';
let _charts = {};

// ── Maps ──────────────────────────────────────────────────────────────────────
let _map = null, _mapReady = false, _mapsApiReady = false;
let _choroplethLayer = null, _infoWindow = null;
let _mapLayer = 'rpsq'; // 'rpsq' | 'count'
let _topoFeatures = null; // cached after first fetch

window._mapsReady = () => {
  _mapsApiReady = true;
  if (_currentSection === 'map' && _listings.length) _initMap();
};

function _initMap() {
  if (_map) { _styleChoropleth(); return; }
  const el = document.getElementById('stats-map');
  if (!el || !_mapsApiReady) return;
  _map = new google.maps.Map(el, {
    center: { lat: 35.55, lng: 139.55 }, zoom: 10,
    mapTypeControl: false, streetViewControl: false, fullscreenControl: false,
    styles: [
      { featureType:'all', elementType:'labels.text.fill', stylers:[{color:'#7c7c7c'}] },
      { featureType:'water', elementType:'geometry', stylers:[{color:'#c8d7e0'}] },
      { featureType:'landscape', elementType:'geometry', stylers:[{color:'#f5f5f0'}] },
      { featureType:'road', elementType:'geometry', stylers:[{color:'#e8e4dd'}] },
      { featureType:'poi', elementType:'all', stylers:[{visibility:'off'}] },
    ],
  });
  _infoWindow = new google.maps.InfoWindow({ headerDisabled: true });
  // Double-RAF + 400ms backup for tile-paint reliability across navigation.
  const _sc = { lat: 35.55, lng: 139.55 };
  const _tr = () => { google.maps.event.trigger(_map, 'resize'); _map.setCenter(_sc); };
  requestAnimationFrame(() => requestAnimationFrame(_tr));
  setTimeout(_tr, 400);
  _loadChoropleth();
}

async function _loadChoropleth() {
  if (!_topoFeatures) {
    _topoFeatures = [];
    await Promise.all(TOPO_FILES.map(async f => {
      try {
        const r = await fetch(TOPO_BASE + f);
        if (r.ok) _topoFeatures.push(...(await r.json()).features);
      } catch (_) {}
    }));
  }
  _choroplethLayer = new google.maps.Data({ map: _map });
  _choroplethLayer.addGeoJson({ type:'FeatureCollection', features: _topoFeatures });
  _choroplethLayer.addListener('click', ev => {
    const n3 = ev.feature.getProperty('N03_003') || '';
    const n4 = ev.feature.getProperty('N03_004') || '';
    const ward = _wardStats[n3+n4] ? n3+n4 : (_wardStats[n4] ? n4 : null);
    if (!ward) return;
    const s = _wardStats[ward];
    const viewUrl = `dashboard.html?focus_ward=${encodeURIComponent(ward)}`;
    _infoWindow.setContent(`
      <div style="font-family:'DM Sans',sans-serif;font-size:12px;padding:4px 0 2px;min-width:160px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;">
          <span style="font-weight:600;font-size:12px;">${ward}</span>
          <span onclick="_infoWindow.close()" style="cursor:pointer;font-size:12px;color:#999;line-height:1;padding-left:10px;flex-shrink:0;">✕</span>
        </div>
        <div style="color:#555;line-height:1.7;">${t('map_rpsq')}: <b>¥${fmt(s.avgRpsq)}/㎡</b></div>
        <div style="color:#555;">${t('map_avg_rent')}: ¥${fmt(s.avgRent)}</div>
        <div style="color:#555;">${t('map_count')}: ${s.count}</div>
        <a href="${viewUrl}" style="display:block;margin-top:7px;text-align:center;padding:4px 0;background:#1D9E75;color:#fff;border-radius:5px;font-size:11px;font-weight:600;text-decoration:none;">${t('view_props')}</a>
      </div>`);
    _infoWindow.setPosition(ev.latLng);
    _infoWindow.open(_map);
  });
  _styleChoropleth();
}

function _styleChoropleth() {
  if (!_choroplethLayer || !Object.keys(_wardStats).length) return;
  const key  = _mapLayer === 'count' ? 'count' : 'avgRpsq';
  const vals = Object.values(_wardStats).map(w => w[key]);
  const minV = Math.min(...vals), maxV = Math.max(...vals);
  _choroplethLayer.setStyle(feature => {
    const n3 = feature.getProperty('N03_003') || '';
    const n4 = feature.getProperty('N03_004') || '';
    const ward = _wardStats[n3+n4] ? n3+n4 : (_wardStats[n4] ? n4 : null);
    if (!ward) return {
      fillColor: '#888', fillOpacity: 0.12,
      strokeColor: 'rgba(180,180,180,0.25)', strokeWeight: 0.4, clickable: false,
    };
    const ratio = (_wardStats[ward][key] - minV) / (maxV - minV || 1);
    const hue   = Math.round(220 * (1 - ratio)); // 220=blue→0=red
    return {
      fillColor: `hsl(${hue},70%,52%)`, fillOpacity: 0.65,
      strokeColor: 'rgba(255,255,255,0.5)', strokeWeight: 0.7, clickable: true,
    };
  });
}

// ── Data ──────────────────────────────────────────────────────────────────────
async function loadData() {
  try {
    const r = await fetch(`${API}/listings`);
    if (!r.ok) throw new Error();
    const d = await r.json();
    _listings = (d.listings || []).filter(l => !l.disappeared_at && l.size_m2 > 0 && l.rent > 0);
    _computeStats();
    _trainModel();
    document.getElementById('status-label').textContent =
      `${_listings.length} 件 · ${new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}`;
    document.getElementById('main').classList.toggle('map-mode', _currentSection === 'map');
    renderSection(_currentSection);
  } catch {
    document.getElementById('main').innerHTML =
      `<div class="loading" style="color:var(--danger)">${t('error_server')}</div>`;
  }
}

function _computeStats() {
  const byWard = {};
  for (const l of _listings) {
    if (!byWard[l.ward]) byWard[l.ward] = [];
    byWard[l.ward].push(l);
  }
  _walkMean = mean(_listings.filter(l => l.walk_min != null).map(l => l.walk_min));
  _ageMean  = mean(_listings.filter(l => l.age_years != null).map(l => l.age_years));
  _wardStats = {};
  for (const [ward, ls] of Object.entries(byWard)) {
    const rents = ls.map(l => l.rent), sqms = ls.map(l => l.size_m2);
    const rpsqs = ls.map(l => l.rent / l.size_m2);
    _wardStats[ward] = {
      count: ls.length, listings: ls,
      avgRent: mean(rents), medianRent: median(rents), minRent: Math.min(...rents), maxRent: Math.max(...rents),
      avgSqm: mean(sqms), avgRpsq: mean(rpsqs),
    };
  }
  _globalAvg = mean(_listings.map(l => l.rent / l.size_m2));
}

// ── ML model ──────────────────────────────────────────────────────────────────
const LAYOUTS_OH = ['1K','1DK','1LDK','2DK','2LDK','3DK','3LDK'];

function _featureVec(l) {
  const a = ((l.appliances||'')+' '+(l.features||'')).toLowerCase();
  const has = kw => a.includes(kw) ? 1 : 0;
  return [
    l.size_m2,
    l.walk_min  ?? _walkMean,
    l.age_years ?? _ageMean,
    l.has_parking ? 1 : 0,
    l.source === 'ur' ? 1 : 0,
    _wardStats[l.ward]?.avgRpsq ?? _globalAvg,
    has('エアコン'), has('床暖房'), has('追い焚き'), has('浴室乾燥'),
    has('オートロック'), has('温水洗浄便座'), has('モニター'), has('エレベーター'),
    ...LAYOUTS_OH.map(lay => l.layout === lay ? 1 : 0),
  ];
}

function _trainModel() {
  const valid = _listings.filter(l => l.size_m2 > 0);
  if (valid.length < 10) return;
  const X = valid.map(_featureVec);
  const y = valid.map(l => l.rent);
  const n = X.length, m = X[0].length;

  // Normalize
  const fMu  = X[0].map((_, j) => mean(X.map(r => r[j])));
  const fSig = X[0].map((_, j) => { const mu = fMu[j]; return Math.sqrt(mean(X.map(r => (r[j]-mu)**2))) || 1; });
  const yMu  = mean(y);
  const ySig = Math.sqrt(mean(y.map(v => (v-yMu)**2)));
  const Xn   = X.map(r => r.map((v, j) => (v - fMu[j]) / fSig[j]));
  const yn   = y.map(v => (v - yMu) / ySig);

  // Gradient descent
  let w = new Array(m).fill(0), b = 0;
  for (let e = 0; e < 4000; e++) {
    const lr = e < 2000 ? 0.05 : 0.02;
    let dw = new Array(m).fill(0), db = 0;
    for (let i = 0; i < n; i++) {
      const err = Xn[i].reduce((s, v, j) => s + v * w[j], b) - yn[i];
      Xn[i].forEach((v, j) => dw[j] += err * v / n);
      db += err / n;
    }
    w = w.map((v, j) => v - lr * dw[j]);
    b -= lr * db;
  }

  const predict = l => {
    const xn = _featureVec(l).map((v, j) => (v - fMu[j]) / fSig[j]);
    return xn.reduce((s, v, j) => s + v * w[j], b) * ySig + yMu;
  };

  // Metrics
  const preds   = valid.map(predict);
  const ssTot   = sum(y.map(v => (v - yMu)**2));
  const ssRes   = sum(y.map((v, i) => (v - preds[i])**2));
  const r2      = 1 - ssRes / ssTot;
  const rmse    = Math.sqrt(ssRes / n);
  const mape    = mean(y.map((v, i) => Math.abs((v - preds[i]) / v) * 100));

  // Store raw weights; names resolved at render time via featureNames()
  const weights = w.slice();
  const makeImportance = () => featureNames().map((name, j) => ({ name, val: weights[j], abs: Math.abs(weights[j]) }))
    .sort((a, b) => b.abs - a.abs);

  _model = { predict, r2, rmse, mape, get importance() { return makeImportance(); } };
}

// ── Stats helpers ─────────────────────────────────────────────────────────────
const sum    = a => a.reduce((s, v) => s + v, 0);
const mean   = a => a.length ? sum(a) / a.length : 0;
const median = a => { const s = [...a].sort((a,b)=>a-b); const m = s.length>>1; return s.length%2 ? s[m] : (s[m-1]+s[m])/2; };
const fmt    = n => Math.round(n).toLocaleString('ja-JP');
const fmtK   = n => (_lang === 'ja' && n >= 10000) ? (n/10000).toFixed(1)+'万' : fmt(n);
const pct    = (v, r) => ((v-r)/r*100).toFixed(1);
const escH   = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

// ── Section routing ───────────────────────────────────────────────────────────
function showSection(sec) {
  _currentSection = sec;
  document.querySelectorAll('.rail-icon').forEach((el, i) =>
    el.classList.toggle('active', ['map','overview','ward','ml'][i] === sec));
  document.getElementById('main').classList.toggle('map-mode', sec === 'map');
  renderSection(sec);
}

function renderSection(sec) {
  if (!_listings.length) return;
  Object.values(_charts).forEach(c => c.destroy());
  _charts = {};
  if (sec === 'overview') _renderOverview();
  else if (sec === 'map')  _renderMap();
  else if (sec === 'ward') _renderWard();
  else                     _renderML();
}

// ── Overview ──────────────────────────────────────────────────────────────────
function _renderOverview() {
  const ur = _listings.filter(l => l.source==='ur').length;
  document.getElementById('main').innerHTML = `
    <div class="cards">
      <div class="card"><div class="card-label">${t('card_listings')}</div><div class="card-value">${_listings.length}</div><div class="card-sub">JKK ${_listings.length-ur} · UR ${ur}</div></div>
      <div class="card"><div class="card-label">${t('card_avg_rent')}</div><div class="card-value">¥${fmtK(mean(_listings.map(l=>l.rent)))}</div><div class="card-sub">${t('card_monthly')}</div></div>
      <div class="card"><div class="card-label">${t('card_avg_area')}</div><div class="card-value">${mean(_listings.map(l=>l.size_m2)).toFixed(1)}<small> m²</small></div><div class="card-sub"></div></div>
      <div class="card"><div class="card-label">${t('card_rpsq')}</div><div class="card-value">¥${fmtK(_globalAvg)}</div><div class="card-sub">${t('card_rpsq_sub')}</div></div>
      <div class="card"><div class="card-label">${t('card_wards')}</div><div class="card-value">${Object.keys(_wardStats).length}</div><div class="card-sub">${t('card_wards_sub')}</div></div>
      ${_model ? `<div class="card"><div class="card-label">${t('card_model_r2')}</div><div class="card-value">${(_model.r2*100).toFixed(1)}<small>%</small></div><div class="card-sub">RMSE ¥${fmtK(_model.rmse)}</div></div>` : ''}
    </div>
    <div class="charts-row">
      <div class="chart-box"><div class="chart-title">${t('chart_rent_hist')}</div><canvas id="ch-rent" height="200"></canvas></div>
      <div class="chart-box"><div class="chart-title">${t('chart_rpsq_hist')}</div><canvas id="ch-rpsq" height="200"></canvas></div>
    </div>
    <div class="charts-row">
      <div class="chart-box"><div class="chart-title">${t('chart_scatter')}</div><canvas id="ch-scatter" height="220"></canvas></div>
      <div class="chart-box"><div class="chart-title">${t('chart_layout')}</div><canvas id="ch-layout" height="220"></canvas></div>
    </div>`;
  _drawHist('ch-rent',  _listings.map(l=>l.rent/1000), 10, v=>`${v}k`, c=>c.accent+'cc');
  _drawHist('ch-rpsq',  _listings.map(l=>l.rent/l.size_m2), 200, v=>`¥${v}`, c=>c.blue+'cc');

// ── Map ───────────────────────────────────────────────────────────────────────
function _renderMap() {
  // Null stale map instance before recreating the DOM node it was bound to.
  // Without this, _initMap() early-returns and the new #stats-map is never initialized.
  _map = null;
  _choroplethLayer = null;
  _infoWindow = null;
  document.getElementById('main').innerHTML = `
    <div class="map-wrap">
      <div id="stats-map"></div>
      <div class="map-legend-overlay" id="map-legend-overlay">
        <div id="map-legend-title" style="font-size:10px;font-weight:600;letter-spacing:.04em;margin-bottom:2px;"></div>
        <div class="map-legend-bar"></div>
        <div class="map-legend-labels" id="map-legend-labels"></div>
        <div style="margin-top:5px;font-size:9px;color:rgba(255,255,255,.4);">${t('map_hint')}</div>
      </div>
      <div class="map-layer-pill" id="map-layer-pill">
        <button class="map-layer-btn" onclick="_toggleLayerMenu(event)">
          <span id="map-layer-label">${t('layer_' + _mapLayer)}</span>
          <span class="map-layer-chevron">▾</span>
        </button>
        <div class="map-layer-menu">
          <div class="map-layer-opt${_mapLayer==='rpsq'?' active':''}" onclick="_setMapLayer('rpsq')">
            <span class="opt-dot"></span>${t('layer_rpsq')}
          </div>
          <div class="map-layer-opt${_mapLayer==='count'?' active':''}" onclick="_setMapLayer('count')">
            <span class="opt-dot"></span>${t('layer_count')}
          </div>
        </div>
      </div>
    </div>`;
  _updateLegend();
  if (_mapsApiReady) _initMap();
  document.addEventListener('click', _closeLayerMenu, { once: false, capture: true });
}

function _toggleLayerMenu(ev) {
  ev.stopPropagation();
  document.getElementById('map-layer-pill')?.classList.toggle('open');
}

function _closeLayerMenu(ev) {
  const pill = document.getElementById('map-layer-pill');
  if (!pill) { document.removeEventListener('click', _closeLayerMenu, true); return; }
  if (!pill.contains(ev.target)) pill.classList.remove('open');
}

function _setMapLayer(layer) {
  _mapLayer = layer;
  const pill = document.getElementById('map-layer-pill');
  if (pill) {
    pill.classList.remove('open');
    pill.querySelectorAll('.map-layer-opt').forEach(el =>
      el.classList.toggle('active', el.textContent.trim() === t('layer_' + layer)));
    const lbl = document.getElementById('map-layer-label');
    if (lbl) lbl.textContent = t('layer_' + layer);
  }
  _updateLegend();
  _styleChoropleth();
}

function _updateLegend() {
  const titleEl  = document.getElementById('map-legend-title');
  const labelsEl = document.getElementById('map-legend-labels');
  if (!titleEl || !labelsEl) return;
  if (_mapLayer === 'rpsq') {
    const vals = Object.values(_wardStats).map(w => w.avgRpsq);
    const minV = vals.length ? Math.min(...vals) : 0;
    const maxV = vals.length ? Math.max(...vals) : 1;
    titleEl.textContent  = t('map_rpsq_label');
    labelsEl.innerHTML   = `<span>¥${fmt(minV)}</span><span>¥${fmt(maxV)}</span>`;
  } else {
    const vals = Object.values(_wardStats).map(w => w.count);
    const minV = vals.length ? Math.min(...vals) : 0;
    const maxV = vals.length ? Math.max(...vals) : 1;
    titleEl.textContent  = t('layer_count');
    labelsEl.innerHTML   = `<span>${minV}</span><span>${maxV}</span>`;
  }
}

// ── Ward table ────────────────────────────────────────────────────────────────
let _wSort = 'avgRpsq', _wAsc = false;
function _renderWard() {
  const maxRpsq = Math.max(...Object.values(_wardStats).map(w => w.avgRpsq));
  const rows = Object.entries(_wardStats)
    .sort((a, b) => { const [ka,kb] = _wAsc?[a,b]:[b,a]; const va=ka[1][_wSort],vb=kb[1][_wSort]; return typeof va==='string'?va.localeCompare(vb):va-vb; })
    .map(([ward, s]) => {
      const d = parseFloat(pct(s.avgRpsq, _globalAvg));
      const badge = d>5 ? `<span class="badge badge-up">+${d}%</span>` : d<-5 ? `<span class="badge badge-down">${d}%</span>` : `<span class="badge badge-neu">±0</span>`;
      const barW = Math.round(s.avgRpsq/maxRpsq*100);
      return `<tr><td>${ward}</td><td class="mono">${s.count}</td><td class="mono">¥${fmt(s.avgRent)}</td><td class="mono">¥${fmt(s.medianRent)}</td><td class="mono">¥${fmt(s.minRent)}–¥${fmt(s.maxRent)}</td>
        <td><div style="display:flex;align-items:center;gap:5px;"><span class="mono">¥${fmt(s.avgRpsq)}</span><div style="flex:1;height:4px;background:var(--surface2);border-radius:2px;min-width:40px;"><div style="width:${barW}%;height:100%;background:var(--accent);border-radius:2px;"></div></div></div></td>
        <td>${badge}</td><td class="mono">${s.avgSqm.toFixed(1)} m²</td></tr>`;
    }).join('');

  const th = (col, key) => `<th onclick="sortWard('${col}')">${t(key)}${col===_wSort?(_wAsc?' ▲':' ▼'):''}</th>`;
  document.getElementById('main').innerHTML = `
    <div class="section-header"><span class="section-title">${t('ward_title')}</span><span class="section-sub">${t('ward_global_avg')} ¥${fmt(_globalAvg)} ${t('card_rpsq_sub')}</span></div>
    <div class="chart-box" style="margin-bottom:14px;"><div class="chart-title">${t('ward_chart_title')}</div><canvas id="ch-ward" height="130"></canvas></div>
    <div class="table-wrap">
      <table class="data-table"><thead><tr>${th('ward','col_ward')}${th('count','col_count')}${th('avgRent','col_avg_rent')}${th('medianRent','col_median')}<th>${t('col_minmax')}</th>${th('avgRpsq','col_rpsq')}<th>${t('col_vs_global')}</th>${th('avgSqm','col_avg_area')}</tr></thead><tbody>${rows}</tbody></table>
    </div>`;
  _drawWardBar();
}
function sortWard(col) { _wAsc = _wSort===col ? !_wAsc : false; _wSort = col; _renderWard(); }

// ── ML section ────────────────────────────────────────────────────────────────
let _mlSrc = 'all', _mlQ = '', _mlSort = 'absDiff', _mlAsc = false;

function _renderML() {
  if (!_model) { document.getElementById('main').innerHTML = `<div class="loading">${t('ml_not_ready')}</div>`; return; }
  const { r2, rmse, mape, importance } = _model;
  const topImp = importance.slice(0, 12);
  const maxImp = topImp[0].abs;
  const impBars = topImp.map(f => {
    const w = Math.round(f.abs / maxImp * 100);
    return `<div class="bar-row"><span class="bar-label">${f.name}</span><div class="bar-track"><div class="bar-fill${f.val<0?' neg':''}" style="width:${w}%"></div></div><span class="bar-val">${f.val>0?'+':''}${f.val.toFixed(2)}</span></div>`;
  }).join('');

  const nFeat = featureNames().length;
  document.getElementById('main').innerHTML = `
    <div class="section-header"><span class="section-title">${t('ml_title')}</span><span class="section-sub">${t('ml_method')} · ${t('ml_features_n', nFeat)} · ${t('ml_trained_n', _listings.length)}</span></div>
    <div class="metrics-row">
      <div class="metric-card"><div class="metric-val" style="color:var(--accent)">${(r2*100).toFixed(1)}%</div><div class="metric-label">${t('ml_r2')}</div></div>
      <div class="metric-card"><div class="metric-val">¥${fmtK(rmse)}</div><div class="metric-label">${t('ml_rmse')}</div></div>
      <div class="metric-card"><div class="metric-val">${mape.toFixed(1)}%</div><div class="metric-label">${t('ml_mape')}</div></div>
    </div>
    <div class="charts-row">
      <div class="chart-box">
        <div class="chart-title">${t('ml_importance')}</div>
        <div style="padding-top:4px;">${impBars}</div>
      </div>
      <div class="chart-box">
        <div class="chart-title">${t('ml_pred_chart')}</div>
        <canvas id="ch-pred" height="260"></canvas>
      </div>
    </div>
    <div class="table-wrap">
      <div class="tbl-ctrl">
        <select onchange="_mlSrc=this.value;_renderMLTable()">
          <option value="all">${t('ml_filter_all')}</option>
          <option value="jkk">JKK</option>
          <option value="ur">UR</option>
        </select>
        <input placeholder="${t('ml_filter_ph')}" oninput="_mlQ=this.value.toLowerCase();_renderMLTable()">
      </div>
      <div id="ml-table-body"></div>
    </div>`;
  _drawPredScatter();
  _renderMLTable();
}

function _renderMLTable() {
  let rows = _listings.filter(l => {
    if (_mlSrc !== 'all' && l.source !== _mlSrc) return false;
    if (_mlQ) { const h=(l.name+l.ward).toLowerCase(); if (!h.includes(_mlQ)) return false; }
    return true;
  }).map(l => {
    const pred    = _model.predict(l);
    const diff    = l.rent - pred;
    const diffPct = diff / pred * 100;
    return { ...l, pred, diff, absDiff: Math.abs(diff), diffPct };
  });
  rows.sort((a, b) => { const [ka,kb]=_mlAsc?[a,b]:[b,a]; return (kb[_mlSort]??0)-(ka[_mlSort]??0); });

  const th = (col, key) => `<th onclick="sortML('${col}')">${t(key)}${col===_mlSort?(_mlAsc?' ▲':' ▼'):''}</th>`;
  const tbody = rows.map(l => {
    const dp = l.diffPct.toFixed(1);
    const badge = l.diffPct > 8 ? `<span class="badge badge-up">+${dp}%</span>` : l.diffPct < -8 ? `<span class="badge badge-down">${dp}%</span>` : `<span class="badge badge-neu">±${Math.abs(dp)}%</span>`;
    const sc = l.source==='ur'?'#3B82F6':'#DC2626';
    return `<tr style="cursor:pointer" onclick="window.open('property.html?id=${encodeURIComponent(l.id)}','_blank')">
      <td><span style="font-size:9px;font-weight:700;color:${sc};text-transform:uppercase">${l.source}</span></td>
      <td style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${escH(l.name)}">${escH(l.name)}</td>
      <td>${escH(l.ward)}</td>
      <td class="mono">${l.layout}</td>
      <td class="mono">${l.size_m2}m²</td>
      <td class="mono">¥${fmt(l.rent)}</td>
      <td class="mono">¥${fmt(Math.round(l.pred))}</td>
      <td class="mono" style="color:${l.diff>0?'var(--danger)':'var(--accent)'}">${l.diff>0?'+':''}¥${fmt(Math.round(l.diff))}</td>
      <td>${badge}</td>
    </tr>`;
  }).join('');

  document.getElementById('ml-table-body').innerHTML = `
    <table class="data-table"><thead><tr>
      <th>${t('col_src')}</th>${th('name','col_name')}${th('ward','col_ward')}<th>${t('col_layout')}</th>${th('size_m2','col_area')}${th('rent','col_actual')}${th('pred','col_predicted')}${th('diff','col_diff')}${th('diffPct','col_deviation')}
    </tr></thead><tbody>${tbody||`<tr><td colspan="9" style="text-align:center;padding:16px;color:var(--muted)">${t('ml_no_results')}</td></tr>`}</tbody></table>`;
}
function sortML(col) { _mlAsc = _mlSort===col ? !_mlAsc : false; _mlSort = col; _renderMLTable(); }

// ── Chart helpers ─────────────────────────────────────────────────────────────
function cc() {
  const d = window.matchMedia('(prefers-color-scheme:dark)').matches;
  return { grid:d?'rgba(255,255,255,.06)':'rgba(0,0,0,.06)', tick:d?'rgba(255,255,255,.45)':'rgba(0,0,0,.45)', accent:d?'#5DCAA5':'#1D9E75', blue:d?'#60A5FA':'#3B82F6', red:d?'#F87171':'#DC2626' };
}
function baseOpts(c) {
  return { responsive:true, maintainAspectRatio:true,
    plugins:{ legend:{display:false}, tooltip:{bodyFont:{family:'DM Mono'}} },
    scales:{ x:{grid:{color:c.grid},ticks:{color:c.tick,font:{family:'DM Mono',size:10}}}, y:{grid:{color:c.grid},ticks:{color:c.tick,font:{family:'DM Mono',size:10}}} } };
}
function hist(vals, step) {
  const lo = Math.floor(Math.min(...vals)/step)*step, hi = Math.ceil(Math.max(...vals)/step)*step;
  const bs = [];
  for (let v=lo; v<hi; v+=step) bs.push({ l:v, n:vals.filter(x=>x>=v&&x<v+step).length });
  return bs;
}
function _drawHist(id, vals, step, labelFn, colorFn) {
  const c=cc(), bs=hist(vals,step);
  _charts[id]=new Chart(document.getElementById(id),{type:'bar',data:{labels:bs.map(b=>labelFn(b.l)),datasets:[{data:bs.map(b=>b.n),backgroundColor:colorFn(c),borderRadius:3,borderSkipped:false}]},options:baseOpts(c)});
}
function _drawScatter() {
  const c=cc();
  const onClick=(ev,els)=>{ if(els.length){const pt=_charts['sc'].data.datasets[els[0].datasetIndex].data[els[0].index];if(pt.id)window.open(`property.html?id=${pt.id}`,'_blank');} };
  _charts['sc']=new Chart(document.getElementById('ch-scatter'),{type:'scatter',data:{datasets:[
    {label:'JKK',data:_listings.filter(l=>l.source!=='ur').map(l=>({x:l.size_m2,y:l.rent/1000,n:l.name,id:l.id})),backgroundColor:c.red+'99',pointRadius:4,pointHoverRadius:6},
    {label:'UR', data:_listings.filter(l=>l.source==='ur').map(l=>({x:l.size_m2,y:l.rent/1000,n:l.name,id:l.id})),backgroundColor:c.blue+'99',pointRadius:4,pointHoverRadius:6},
  ]},options:{...baseOpts(c),onClick,plugins:{legend:{display:true,labels:{color:c.tick,font:{family:'DM Sans',size:11}}},tooltip:{callbacks:{label:ctx=>`${ctx.raw.n} · ${ctx.raw.x}㎡ · ¥${ctx.raw.y}k`}}}}});
  document.getElementById('ch-scatter').style.cursor='pointer';
}
function _drawLayout() {
  const c=cc(), lays=[...new Set(_listings.map(l=>l.layout))].sort();
  _charts['lay']=new Chart(document.getElementById('ch-layout'),{type:'bar',data:{labels:lays,datasets:[
    {label:'JKK',data:lays.map(lay=>_listings.filter(l=>l.layout===lay&&l.source!=='ur').length),backgroundColor:c.red+'cc',borderRadius:3,borderSkipped:false},
    {label:'UR', data:lays.map(lay=>_listings.filter(l=>l.layout===lay&&l.source==='ur').length), backgroundColor:c.blue+'cc',borderRadius:3,borderSkipped:false},
  ]},options:{...baseOpts(c),plugins:{legend:{display:true,labels:{color:c.tick,font:{family:'DM Sans',size:11}}}},scales:{x:{...baseOpts(c).scales.x,stacked:true},y:{...baseOpts(c).scales.y,stacked:true}}}});
}
function _drawWardBar() {
  const c=cc(), avg=_globalAvg;
  const sorted=Object.entries(_wardStats).sort((a,b)=>b[1].avgRpsq-a[1].avgRpsq).slice(0,20);
  _charts['ward']=new Chart(document.getElementById('ch-ward'),{type:'bar',data:{labels:sorted.map(([w])=>w),datasets:[{label:'㎡単価',data:sorted.map(([,s])=>Math.round(s.avgRpsq)),backgroundColor:sorted.map(([,s])=>s.avgRpsq>avg?c.red+'bb':c.accent+'bb'),borderRadius:3}]},options:{...baseOpts(c),plugins:{...baseOpts(c).plugins,tooltip:{callbacks:{label:ctx=>`¥${fmt(ctx.parsed.y)}/㎡/月`}}}},});
}
function _drawPredScatter() {
  const c=cc();
  // x = Predicted, y = Actual (standard residual-analysis convention)
  const pts=_listings.map(l=>({x:Math.round(_model.predict(l))/1000,y:l.rent/1000,n:l.name,s:l.source,id:l.id}));
  const maxV=Math.max(...pts.flatMap(p=>[p.x,p.y]));
  const onClick=(ev,els)=>{ if(els.length){const ds=_charts['pred'].data.datasets[els[0].datasetIndex];if(ds.label!==t('ml_ideal')){const pt=ds.data[els[0].index];if(pt.id)window.open(`property.html?id=${pt.id}`,'_blank');}} };
  _charts['pred']=new Chart(document.getElementById('ch-pred'),{type:'scatter',data:{datasets:[
    {label:'JKK',data:pts.filter(p=>p.s!=='ur'),backgroundColor:c.red+'99',pointRadius:3,pointHoverRadius:5},
    {label:'UR', data:pts.filter(p=>p.s==='ur'), backgroundColor:c.blue+'99',pointRadius:3,pointHoverRadius:5},
    {label:t('ml_ideal'),data:[{x:0,y:0},{x:maxV,y:maxV}],type:'line',borderColor:c.accent+'88',borderDash:[4,3],borderWidth:1.5,pointRadius:0,fill:false},
  ]},options:{...baseOpts(c),onClick,plugins:{legend:{display:true,labels:{color:c.tick,font:{family:'DM Sans',size:11}}},tooltip:{callbacks:{label:ctx=>ctx.dataset.label===t('ml_ideal')?null:`${ctx.raw.n} · 予:¥${ctx.raw.x}k 実:¥${ctx.raw.y}k`}}},scales:{x:{...baseOpts(c).scales.x,title:{display:true,text:t('ml_pred_axis'),color:c.tick}},y:{...baseOpts(c).scales.y,title:{display:true,text:t('ml_actual_axis'),color:c.tick}}}}});
  document.getElementById('ch-pred').style.cursor='pointer';
}

// ── Boot ──────────────────────────────────────────────────────────────────────
applyLang();
loadData();
</script>
