<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>物件詳細</title>
<script>

  // Placeholder so Maps API can fire the callback even if it loads before the main script.
  window._mapsReady = function(){ window._mapsReadyPending = true; };
  var s=document.createElement('script');s.async=true;
  s.src='https://maps.googleapis.com/maps/api/js?key=AIzaSyBHw3d6FU73jXiJxUJoZ4MlDGu2CmhC4i8&callback=_mapsReady';
  document.head.appendChild(s);
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="/detail-parser.js?v=2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');
:root {
  --bg:#18181a; --surface:#242426; --surface2:#2e2e30;
  --rail-bg:#27272b;
  --border:rgba(255,255,255,.08); --text:rgba(255,255,255,.87); --muted:rgba(255,255,255,.42);
  --accent:#5DCAA5; --accent-light:rgba(93,202,165,.12); --accent-dark:#1D9E75;
  --danger:#E24B4A; --warn:#EF9F27;
  --radius:10px; --font:'DM Sans',system-ui,sans-serif; --mono:'DM Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;font-family:var(--font);background:var(--bg);color:var(--text);}

/* ── topbar ── */
.topbar{
  display:grid;grid-template-columns:38px 1fr;
  height:38px;max-height:38px;overflow:hidden;
  position:sticky;top:0;z-index:20;
}
.topbar-rail{
  background:var(--rail-bg);display:flex;align-items:center;justify-content:center;
  border-bottom:1px solid rgba(255,255,255,.07);
}
.topbar-main{
  background:var(--rail-bg);border-bottom:1px solid rgba(255,255,255,.07);
  display:flex;align-items:center;gap:10px;padding:0 14px;
}
.dot{width:22px;height:22px;background:var(--accent-dark);border-radius:6px;
  display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;font-weight:700;flex-shrink:0;}
.topbar-title{font-size:13px;font-weight:600;letter-spacing:-.02em;
  color:rgba(255,255,255,.85);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.topbar-sep{width:1px;height:16px;background:rgba(255,255,255,.1);flex-shrink:0;}
.src-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;letter-spacing:.05em;flex-shrink:0;}
.src-badge.jkk{background:rgba(226,75,74,.18);color:#E24B4A;}
.src-badge.ur{background:rgba(59,130,246,.18);color:#60A5FA;}
.topbar-btn{
  background:none;border:1px solid rgba(255,255,255,.15);border-radius:10px;
  padding:2px 9px;font-size:10px;color:rgba(255,255,255,.45);cursor:pointer;
  font-family:var(--font);text-decoration:none;transition:all .15s;white-space:nowrap;
  display:flex;align-items:center;
}
.topbar-btn:hover{border-color:var(--accent);color:var(--accent);}
.back-btn{
  background:none;border:none;color:rgba(255,255,255,.5);cursor:pointer;
  font-size:18px;line-height:1;padding:0;transition:color .15s;
}
.back-btn:hover{color:var(--accent);}

/* ── layout ── */
.layout{
  display:grid;grid-template-columns:1fr 400px;
  height:calc(100vh - 38px);overflow:hidden;
}

/* ── photo panel (left) ── */
.photo-panel{
  position:relative;background:#000;
  display:flex;flex-direction:column;overflow:hidden;
}
.photo-main-wrap{
  flex:1;position:relative;overflow:hidden;min-height:0;
}
.photo-main{
  width:100%;height:100%;object-fit:contain;display:block;
}
.photo-nav{
  position:absolute;top:50%;transform:translateY(-50%);
  background:rgba(0,0,0,.55);backdrop-filter:blur(4px);
  border:none;border-radius:50%;width:38px;height:38px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:#fff;font-size:18px;transition:background .12s;z-index:2;
}
.photo-nav:hover{background:rgba(0,0,0,.8);}
.photo-nav.prev{left:12px;}.photo-nav.next{right:12px;}
.photo-badge{
  position:absolute;bottom:10px;left:12px;
  background:var(--accent-dark);color:#fff;
  font-size:9px;font-weight:700;padding:2px 8px;border-radius:5px;letter-spacing:.06em;
}
.photo-counter{
  position:absolute;bottom:10px;right:12px;
  background:rgba(0,0,0,.6);color:rgba(255,255,255,.7);
  font-size:10px;font-family:var(--mono);padding:2px 8px;border-radius:5px;
}
/* filter chips */
.photo-filter-bar{
  background:rgba(0,0,0,.7);backdrop-filter:blur(8px);
  display:flex;gap:6px;padding:7px 12px;border-bottom:1px solid rgba(255,255,255,.06);
  flex-shrink:0;
}
.pf-chip{
  padding:3px 10px;border-radius:12px;font-size:10px;font-weight:600;
  border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.5);
  cursor:pointer;background:none;font-family:var(--font);transition:all .12s;
}
.pf-chip.active{background:var(--accent-dark);border-color:var(--accent-dark);color:#fff;}
/* thumbnail strip */
.photo-strip{
  flex-shrink:0;background:rgba(0,0,0,.8);
  display:flex;gap:4px;padding:6px 8px;overflow-x:auto;height:66px;align-items:center;
}
.photo-strip::-webkit-scrollbar{height:3px;}
.photo-strip::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:2px;}
.photo-thumb{
  width:80px;height:54px;flex-shrink:0;object-fit:cover;border-radius:6px;
  cursor:pointer;border:2px solid transparent;opacity:.5;transition:all .12s;
}
.photo-thumb.active{border-color:var(--accent);opacity:1;}
.photo-thumb.fp{border-color:rgba(93,202,165,.4);opacity:.75;}
.no-photo{
  flex:1;display:flex;align-items:center;justify-content:center;
  color:rgba(255,255,255,.2);font-size:13px;
}

/* ── info panel (right) ── */
.info-panel{
  background:var(--surface);border-left:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
}

/* tab bar */
.tab-bar{
  display:flex;border-bottom:1px solid var(--border);flex-shrink:0;
  background:var(--surface);overflow-x:auto;
}
.tab-bar::-webkit-scrollbar{display:none;}
.tab-btn{
  padding:0 14px;height:38px;font-size:11px;font-weight:600;
  border:none;background:none;color:var(--muted);cursor:pointer;
  border-bottom:2px solid transparent;white-space:nowrap;font-family:var(--font);
  transition:all .12s;flex-shrink:0;
}
.tab-btn:hover{color:var(--text);}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}

/* tab pane */
.tab-pane{display:none;flex:1;overflow-y:auto;padding:16px;}
.tab-pane.active{display:flex;flex-direction:column;gap:12px;}
.tab-pane::-webkit-scrollbar{width:4px;}
.tab-pane::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:2px;}

/* section label */
.s-label{
  font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;
  color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:8px;
}
.s-label::after{content:'';flex:1;height:1px;background:var(--border);}

/* fact grid */
.fact-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.fact{background:var(--surface2);border-radius:8px;padding:10px 12px;}
.fact.wide{grid-column:1/-1;}
.fact.accent{background:var(--accent-light);border:1px solid rgba(93,202,165,.15);}
.f-label{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:3px;}
.f-value{font-size:15px;font-weight:600;color:var(--text);}
.f-value.accent{color:var(--accent);}
.f-sub{font-size:11px;color:var(--muted);margin-top:1px;}

/* info rows */
.info-row{display:flex;justify-content:space-between;align-items:center;
  padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:12px;}
.info-row:last-child{border-bottom:none;}
.ir-label{color:var(--muted);font-size:11px;}
.ir-value{font-weight:500;text-align:right;font-size:12px;max-width:55%;}

/* tags */
.tag-wrap{display:flex;flex-wrap:wrap;gap:5px;}
.tag{padding:3px 8px;background:var(--surface2);border-radius:5px;font-size:11px;color:var(--text);border:1px solid var(--border);}

/* apply btn */
.apply-btn{
  display:block;width:100%;padding:10px;background:var(--accent-dark);color:#fff;
  border:none;border-radius:8px;font-family:var(--font);font-size:13px;font-weight:600;
  cursor:pointer;text-align:center;text-decoration:none;transition:opacity .12s;
}
.apply-btn:hover{opacity:.85;}
.apply-btn:disabled{opacity:.35;cursor:default;}

/* floor plan rooms table */
.rooms-table{width:100%;border-collapse:collapse;font-size:12px;}
.rooms-table th{text-align:left;padding:5px 6px;font-size:9px;font-weight:600;
  color:var(--muted);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border);}
.rooms-table td{padding:5px 6px;border-bottom:1px solid rgba(255,255,255,.03);}
.rooms-table tr:last-child td{border-bottom:none;}
.rooms-table tr:hover td{background:rgba(255,255,255,.03);}
.r-badge{display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:600;}
.num{font-family:var(--mono);font-size:11px;}

/* market pills */
.market-pills{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.mpill{background:var(--surface2);border-radius:8px;padding:10px;text-align:center;}
.mp-label{font-size:9px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;}
.mp-value{font-size:14px;font-weight:700;}
.mp-value.good{color:var(--accent);}
.mp-value.warn{color:var(--warn);}
.chart-wrap{height:110px;position:relative;}

/* commute */
.commute-row{display:flex;gap:6px;}
.commute-input{
  flex:1;padding:7px 10px;border:1px solid var(--border);border-radius:8px;
  font-family:var(--font);font-size:12px;color:var(--text);background:var(--surface2);outline:none;
}
.commute-input:focus{border-color:var(--accent);}
.commute-input::placeholder{color:var(--muted);}
.mode-btns{display:flex;gap:5px;flex-wrap:wrap;}
.mode-btn{
  padding:4px 9px;border:1px solid var(--border);border-radius:6px;
  font-size:11px;font-family:var(--font);cursor:pointer;background:none;
  color:var(--muted);transition:all .12s;
}
.mode-btn:hover{border-color:var(--accent);color:var(--accent);}
.mode-btn.active{background:var(--accent-dark);border-color:var(--accent-dark);color:#fff;}
.commute-result{
  background:var(--surface2);border-radius:8px;padding:9px 12px;font-size:12px;
  color:var(--text);line-height:1.6;display:none;
}
.commute-result.on{display:block;}
.gmaps-link{font-size:11px;color:var(--accent);text-decoration:none;display:inline-block;margin-top:3px;}
/* facilities panel */
.fac-section-hdr{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
.fac-tog-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:8px;}
.fac-tog-row{display:flex;align-items:center;gap:6px;padding:5px 8px;border-bottom:1px solid var(--border);min-width:0;}
.fac-tog-row:nth-last-child(-n+2){border-bottom:none;}
.fac-tog-row:nth-child(odd){border-right:1px solid var(--border);}
.fac-table td,.fac-table th{padding:4px 6px 4px 0;font-size:11px;}
.fac-table th{font-size:10px;font-weight:600;color:var(--muted);cursor:pointer;}
.fac-table th.sort-active{color:var(--accent);}
.fac-row:hover td{background:var(--surface2);}
.sort-table{width:100%;border-collapse:collapse;}
.sort-table thead th{border-bottom:1px solid var(--border);}
/* layer toggle */
.tog{position:relative;display:inline-block;width:28px;height:16px;}
.tog input{opacity:0;width:0;height:0;}
.tog-slider{position:absolute;cursor:pointer;inset:0;background:rgba(255,255,255,.15);border-radius:8px;transition:.2s;}
.tog-slider:before{content:'';position:absolute;width:12px;height:12px;left:2px;bottom:2px;background:#fff;border-radius:50%;transition:.2s;}
.tog input:checked+.tog-slider{background:var(--accent);}
.tog input:checked+.tog-slider:before{transform:translateX(12px);}
.layer-label{display:flex;align-items:center;gap:4px;flex:1;min-width:0;}

/* structured detail sections */
.ds-table{border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.ds-row{display:grid;grid-template-columns:120px 1fr;border-bottom:1px solid var(--border);font-size:12px;}
.ds-row:last-child{border-bottom:none;}
.ds-key{padding:7px 10px;background:var(--surface2);color:var(--muted);font-size:11px;
  font-weight:600;border-right:1px solid var(--border);line-height:1.4;}
.ds-val{padding:7px 10px;color:var(--text);line-height:1.5;word-break:break-word;}

/* spinner / error */
.fullpage-msg{
  height:calc(100vh - 38px);display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:13px;
}

@media print{
  .topbar-btn,.back-btn,.photo-nav,.photo-filter-bar,.photo-strip,.mode-btns,.commute-row,
  .tab-bar{display:none!important;}
  .layout{display:block;}
  .tab-pane{display:flex!important;overflow:visible!important;height:auto!important;}
  body,html{overflow:auto!important;height:auto!important;}
}
</style>
</head>
<body>

<!-- topbar -->
<div class="topbar">
  <div class="topbar-rail">
    <button class="back-btn" onclick="history.back()" title="戻る">‹</button>
  </div>
  <div class="topbar-main">
    <div class="dot">J</div>
    <div class="topbar-title" id="tb-title">読み込み中…</div>
    <div class="topbar-sep"></div>
    <span class="src-badge" id="tb-badge" style="display:none"></span>
    <button class="topbar-btn" onclick="window.print()">🖨</button>
    <button class="topbar-btn" id="share-btn" onclick="shareProperty()">⤴ 共有</button>
  </div>
</div>

<div id="root"><div class="fullpage-msg">読み込み中…</div></div>

<script>
const API = 'https://jkk-monitor.duckdns.org/api';
const LISTING_ID = new URLSearchParams(location.search).get('id') || '';

let _listing = null;
let _allListings = [];
let _galleryImgs = [];
let _galleryIdx = 0;
let _galleryFilter = 'all';
let _map = null, _mapsReady = false;
let _dirService = null, _dirRenderer = null;
let _rentChart = null;
// facilities
let _facLoaded = false;
let _facilityMarkers = [];
let _facilityMarkerObjs = [];
let _facilityCircle = null;
let _facTransitLines = [];
const _facRouteCache = new Map();
let _facTableSort = {col:'distance_m', asc:true};
const _facTypeLayers = {
  konbini:true, supermarket:true, kindergarten:true, school:true,
  hospital:true, clinic:true, pharmacy:true, park:true, station:true,
};
const POI_ZOOM_MIN = 13;

window._mapsReady = () => {
  _mapsReady = true;
  // If a map tab is already active (user opened the link directly), init now
  const activePane = document.querySelector('.tab-pane.active');
  if (activePane && MAP_TABS.has(activePane.id)) {
    if (!_map) _initMap();
    if (activePane.id === 't-facilities' && !_facLoaded) loadFacilities();
  }
};
// Flush in case Maps API fired the placeholder before this script ran
if (window._mapsReadyPending) { window._mapsReadyPending = false; window._mapsReady(); }

// ── boot ──────────────────────────────────────────────────────────────────────
async function boot() {
  if (!LISTING_ID) { showError('物件IDが指定されていません。'); return; }
  const [lr, ar] = await Promise.all([
    fetch(`${API}/listings/${LISTING_ID}`).then(r => r.json()).catch(() => ({error:'fetch failed'})),
    fetch(`${API}/listings`).then(r => r.json()).catch(() => ({listings:[]})),
  ]);
  if (lr.error) { showError(`物件が見つかりません (${LISTING_ID})`); return; }
  _listing = lr;
  _allListings = (ar.listings || []).filter(l => !l.disappeared_at && l.rent > 0 && l.size_m2 > 0);
  try { render(); } catch(e) { showError('表示エラー: ' + e.message); }
}

function showError(msg) {
  document.getElementById('root').innerHTML = `<div class="fullpage-msg">${esc(msg)}</div>`;
}

// ── utilities ─────────────────────────────────────────────────────────────────
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmt(n) { return n != null ? Number(n).toLocaleString() : '—'; }
function fmtAge(a) { return (a == null) ? '—' : a === 0 ? '新築' : `${a}年`; }
const ROOM_COLORS = {
  LDK:'#1D9E75',LD:'#1D9E75',DK:'#1D9E75',L:'#1D9E75',D:'#1D9E75',K:'#EF9F27',
  洋室:'#3B82F6',和室:'#8B5CF6',バルコニー:'#0EA5E9',
  トイレ:'#6B7280',浴室:'#6B7280',洗面所:'#6B7280',玄関:'#A78BFA',
  廊下:'#4B5563',WIC:'#F59E0B',クローゼット:'#F59E0B',収納:'#6B7280',
};

// ── render ────────────────────────────────────────────────────────────────────
function render() {
  const l = _listing;
  document.title = l.name || '物件詳細';
  document.getElementById('tb-title').textContent = l.name || '';
  const badge = document.getElementById('tb-badge');
  badge.textContent = l.source === 'ur' ? 'UR' : 'JKK';
  badge.className = `src-badge ${l.source || 'jkk'}`;
  badge.style.display = '';

  // exterior/interior first, floor plans last
  const rawImgs = l.images || [];
  const photoImgs = rawImgs.filter(i => i.type !== 'floor_plan');
  const fpImgs    = rawImgs.filter(i => i.type === 'floor_plan');
  _galleryImgs = [...photoImgs, ...fpImgs];
  _galleryFilter = photoImgs.length ? 'photos' : 'floor_plan';
  _galleryIdx = 0;

  // market stats
  const rpsq = l.size_m2 ? Math.round(l.rent / l.size_m2) : null;
  const wardPeers   = _allListings.filter(x => x.ward === l.ward);
  const layoutPeers = _allListings.filter(x => x.layout === l.layout);
  const rentRank    = _allListings.filter(x => x.rent < l.rent).length;
  const rentPct     = Math.round((rentRank / Math.max(_allListings.length - 1, 1)) * 100);
  const wardAvgRpsq = wardPeers.length ? wardPeers.reduce((s,x) => s + x.rent/x.size_m2, 0) / wardPeers.length : null;
  const layoutAvg   = layoutPeers.length ? Math.round(layoutPeers.reduce((s,x) => s + x.rent, 0) / layoutPeers.length) : null;
  const rpsqVsWard  = wardAvgRpsq && rpsq ? Math.round(((rpsq - wardAvgRpsq) / wardAvgRpsq) * 100) : null;
  const rentVsLay   = layoutAvg ? Math.round(((l.rent - layoutAvg) / layoutAvg) * 100) : null;

  // floor plan
  const fp    = l.floor_plan_data || {};
  const rooms = fp.rooms || [];

  document.getElementById('root').innerHTML = `
  <div class="layout">

    <!-- ── PHOTO PANEL ── -->
    <div class="photo-panel">
      <!-- gallery (default visible) -->
      <div id="gallery-section" style="display:flex;flex-direction:column;height:100%;">
        ${_galleryImgs.length ? `
          <div class="photo-filter-bar">
            <button class="pf-chip${!photoImgs.length?'':''}" onclick="setFilter('all')">すべて ${_galleryImgs.length}</button>
            ${fpImgs.length ? `<button class="pf-chip${_galleryFilter==='floor_plan'?' active':''}" onclick="setFilter('floor_plan')">間取り ${fpImgs.length}</button>` : ''}
            ${photoImgs.length ? `<button class="pf-chip active" onclick="setFilter('photos')">写真 ${photoImgs.length}</button>` : ''}
          </div>
          <div class="photo-main-wrap">
            <img class="photo-main" id="ph-main" src="" onerror="this.style.opacity='.2'">
            <button class="photo-nav prev" onclick="navPh(-1)">‹</button>
            <button class="photo-nav next" onclick="navPh(1)">›</button>
            <div class="photo-badge" id="ph-badge" style="display:none">FLOOR PLAN</div>
            <div class="photo-counter" id="ph-ctr"></div>
          </div>
          <div class="photo-strip" id="ph-strip">
            ${_galleryImgs.map((img,i) => {
              const src = imgSrc(img.url);
              return `<img class="photo-thumb${img.type==='floor_plan'?' fp':''}" src="${esc(src)}"
                onclick="jumpPh(${i})" onerror="this.style.display='none'" loading="lazy">`;
            }).join('')}
          </div>
        ` : '<div class="no-photo">📷 写真なし</div>'}
      </div>
      <!-- map (shown for 交通 / 施設 tabs) -->
      <div id="prop-map-wrap" style="display:none;width:100%;height:100%;position:relative;">
        <div id="prop-map" style="width:100%;height:100%;"></div>
        <div id="fac-chip" style="display:none;position:absolute;top:8px;left:8px;z-index:5;
          background:rgba(255,255,255,.92);border-radius:6px;padding:4px 9px;
          font-family:var(--font);font-size:11px;color:#333;line-height:1.4;
          box-shadow:0 1px 4px rgba(0,0,0,.18);pointer-events:none;max-width:200px;"></div>
      </div>
    </div>

    <!-- ── INFO PANEL ── -->
    <div class="info-panel">
      <div class="tab-bar">
        <button class="tab-btn active" onclick="switchTab(this,'t-overview')">概要</button>

// ── gallery ───────────────────────────────────────────────────────────────────
function imgSrc(url) {
  return url.startsWith('/') ? API.replace('/api','') + url : url;
}
function filteredImgs() {
  if (_galleryFilter === 'floor_plan') return _galleryImgs.filter(i => i.type === 'floor_plan');
  if (_galleryFilter === 'photos')    return _galleryImgs.filter(i => i.type !== 'floor_plan');
  return _galleryImgs;
}
function setFilter(f) {
  _galleryFilter = f; _galleryIdx = 0;
  document.querySelectorAll('.pf-chip').forEach(b => {
    b.classList.toggle('active',
      (f==='all' && b.textContent.startsWith('すべて')) ||
      (f==='floor_plan' && b.textContent.startsWith('間取り')) ||
      (f==='photos' && b.textContent.startsWith('写真'))
    );
  });
  updateGallery();
}
function navPh(d) { const fi=filteredImgs(); _galleryIdx=(_galleryIdx+d+fi.length)%fi.length; updateGallery(); }
function jumpPh(absIdx) {
  const img = _galleryImgs[absIdx];
  const fi = filteredImgs();
  const pos = fi.indexOf(img);
  if (pos >= 0) { _galleryIdx = pos; }
  else { _galleryFilter='all'; _galleryIdx=absIdx; }
  updateGallery();
}
function updateGallery() {
  const fi = filteredImgs();
  if (!fi.length) return;
  const img = fi[_galleryIdx];
  const mainEl = document.getElementById('ph-main');
  if (mainEl) { mainEl.src = imgSrc(img.url); mainEl.style.opacity='1'; }
  const ctr = document.getElementById('ph-ctr');
  if (ctr) ctr.textContent = `${_galleryIdx+1} / ${fi.length}`;
  const badge = document.getElementById('ph-badge');
  if (badge) badge.style.display = img.type==='floor_plan' ? '' : 'none';
  document.querySelectorAll('.photo-thumb').forEach((el, i) =>
    el.classList.toggle('active', _galleryImgs[i] === img));
}

// ── tabs ──────────────────────────────────────────────────────────────────────
const MAP_TABS = new Set(['t-commute', 't-facilities']);
function switchTab(btn, id) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b===btn));
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.toggle('active', p.id===id));

  const showMap = MAP_TABS.has(id);
  document.getElementById('gallery-section').style.display = showMap ? 'none' : 'flex';
  document.getElementById('prop-map-wrap').style.display  = showMap ? 'block' : 'none';

  if (id === 't-floorplan') {
    setFilter('floor_plan');
  } else if (!showMap) {
    setFilter('photos');
  }

  if (showMap) {
    setTimeout(() => {
      if (_mapsReady && !_map) _initMap();
      else if (_map) google.maps.event.trigger(_map, 'resize');
      if (id === 't-facilities' && _map && !_facLoaded) loadFacilities();
    }, 60);
  }

  if (id === 't-market' && !_rentChart) drawRentChart();
}

// ── rent histogram ────────────────────────────────────────────────────────────
function drawRentChart() {
  const canvas = document.getElementById('ch-rent');
  if (!canvas || !_allListings.length) return;
  const step = 10000;
  const rents = _allListings.map(x => x.rent);
  const lo = Math.floor(Math.min(...rents)/step)*step;
  const hi = Math.ceil(Math.max(...rents)/step)*step;
  const bins = [];
  for (let v=lo; v<hi; v+=step) bins.push({l:v, n:rents.filter(r=>r>=v&&r<v+step).length});
  const myBin = Math.floor(_listing.rent/step)*step;
  if (_rentChart) _rentChart.destroy();
  _rentChart = new Chart(canvas, {
    type:'bar',
    data:{
      labels: bins.map(b=>`¥${(b.l/1000).toFixed(0)}k`),
      datasets:[{
        data: bins.map(b=>b.n),
        backgroundColor: bins.map(b => b.l===myBin ? '#1D9E75' : 'rgba(255,255,255,.1)'),
        borderRadius:3, borderSkipped:false,
      }],
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{
        title:ctx=>`¥${(bins[ctx[0].dataIndex].l/1000).toFixed(0)}k〜`,
        label:ctx=>`${ctx.raw} 件`,
      }}},
      scales:{
        x:{grid:{display:false},ticks:{color:'rgba(255,255,255,.3)',font:{family:'DM Mono',size:9},maxRotation:45}},
        y:{grid:{color:'rgba(255,255,255,.05)'},ticks:{color:'rgba(255,255,255,.3)',font:{family:'DM Mono',size:9}}},
      },
    },
  });
}

// ── commute ───────────────────────────────────────────────────────────────────
function calcCommute(mode) {
  const dest = document.getElementById('c-dest')?.value.trim();
  if (!dest) { document.getElementById('c-dest')?.focus(); return; }
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  event?.target?.classList.add('active');
  const l = _listing;
  const gmUrl = `https://www.google.com/maps/dir/?api=1&origin=${l.lat},${l.lng}&destination=${encodeURIComponent(dest)}&travelmode=${mode.toLowerCase()}`;
  document.getElementById('c-gmaps').href = gmUrl;
  document.getElementById('c-gmaps').style.display = '';

  if (mode === 'TRANSIT') {
    showCommuteResult('電車の経路はGoogle Mapsで確認できます ↓');
    return;
  }
  if (!_mapsReady || !_dirService) { showCommuteResult('地図読み込み中…'); return; }
  showCommuteResult('計算中…');
  _dirService.route({
    origin:{lat:l.lat,lng:l.lng}, destination:dest,
    travelMode:google.maps.TravelMode[mode],
  }, (result, status) => {
    if (status !== 'OK') { showCommuteResult(`経路なし (${status})`); return; }
    const leg = result.routes[0].legs[0];
    showCommuteResult(`<strong>${leg.duration.text}</strong> · ${leg.distance.text}`);
    _dirRenderer?.setDirections(result);
  });
}
function showCommuteResult(html) {
  const el = document.getElementById('c-result');
  if (el) { el.innerHTML = html; el.classList.add('on'); }
}

    position:{lat:l.lat,lng:l.lng}, map:_map, title:l.name,

  _facTypeLayers[type] = on;
  const ok = _map && _map.getZoom() >= POI_ZOOM_MIN;
  _facilityMarkerObjs.forEach(({marker,facility}) => { if(facility.type===type) marker.setVisible(ok&&on); });
  if (_facilityMarkerObjs.length) _renderFacSection(_facilityMarkerObjs.map(o=>o.facility));
}
window._toggleAllFacTypes = function() {
  const allOn = Object.values(_facTypeLayers).every(v=>v!==false);
  Object.keys(_facTypeLayers).forEach(k => toggleFacType(k,!allOn));
};
window._facSort = function(col) {
  if (_facTableSort.col===col) _facTableSort.asc=!_facTableSort.asc;
  else { _facTableSort.col=col; _facTableSort.asc=true; }
  _renderFacSection(_facilityMarkerObjs.map(o=>o.facility));
};
window._facRowClick = function(idx) {
  if (idx<0||idx>=_facilityMarkerObjs.length) return;
  const {facility,color} = _facilityMarkerObjs[idx];
  showFacChip(color,facility.name,facTypeName(facility.type),facility.distance_m);
  showFacRoute(facility.lat,facility.lng);
};

function _renderFacSection(facilities) {
  const wrap = document.getElementById('fac-section');
  if (!wrap) return;
  const allTypes = [
    ['konbini','コンビニ'],['supermarket','スーパー'],['kindergarten','保育園'],['school','学校'],
    ['hospital','病院'],['clinic','クリニック'],['pharmacy','薬局'],['park','公園'],['station','駅'],
  ];
  const toggleGrid = allTypes.map(([k,label])=>`
    <div class="fac-tog-row" style="cursor:pointer;" onclick="document.getElementById('fac-tog-${k}').click()">
      <span class="layer-label">${facIconHtml(k,14)}<span style="font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${label}</span></span>
      <label class="tog" style="flex-shrink:0;" onclick="event.stopPropagation()">
        <input type="checkbox" id="fac-tog-${k}" ${_facTypeLayers[k]!==false?'checked':''} onchange="toggleFacType('${k}',this.checked)">
        <span class="tog-slider"></span>
      </label>
    </div>`).join('');
  const allOnNow = Object.values(_facTypeLayers).every(v=>v!==false);
  const hdrHtml = `<div class="fac-section-hdr" style="display:flex;align-items:center;justify-content:space-between;">
    <span>周辺施設</span>
    <button onclick="window._toggleAllFacTypes()" style="font-size:9px;padding:2px 7px;border:1px solid var(--border);border-radius:4px;background:var(--surface2);color:var(--muted);cursor:pointer;font-family:var(--font);">${allOnNow?'すべてOFF':'すべてON'}</button>
  </div>`;
  if (facilities===null) {
    wrap.innerHTML = hdrHtml+`<div class="fac-tog-grid">${toggleGrid}</div><div style="font-size:11px;color:var(--muted);padding:6px 0;">読み込み中…</div>`;
    return;
  }
  const visible = facilities.filter(f=>_facTypeLayers[f.type]!==false);
  const hdr = (col,label)=>{const active=_facTableSort.col===col;const ind=active?(_facTableSort.asc?' ▲':' ▼'):'';return `<th class="${active?'sort-active':''}" onclick="window._facSort('${col}')">${label}${ind}</th>`;};
  const sorted=[...visible].sort((a,b)=>{const va=a[_facTableSort.col]??'',vb=b[_facTableSort.col]??'';return _facTableSort.asc?(va<vb?-1:va>vb?1:0):(va>vb?-1:va<vb?1:0);});
  const rows=sorted.map(f=>{
    const idx=_facilityMarkerObjs.findIndex(o=>o.facility===f||(o.facility.name===f.name&&o.facility.distance_m===f.distance_m));
    return `<tr class="fac-row" onclick="window._facRowClick(${idx})" style="cursor:pointer;"><td style="white-space:nowrap;">${facIconHtml(f.type,13)}&nbsp;${esc(facTypeName(f.type))}</td><td>${esc(f.name)}</td><td style="font-family:var(--mono);text-align:right;white-space:nowrap;">${f.distance_m}m</td></tr>`;
  }).join('');
  const tableHtml=visible.length?`<div style="overflow-x:auto;margin-top:6px;"><table class="sort-table fac-table"><thead><tr>${hdr('type','種別')}${hdr('name','名称')}${hdr('distance_m','距離')}</tr></thead><tbody>${rows}</tbody></table></div>`:'';
  wrap.innerHTML = hdrHtml+`<div class="fac-tog-grid">${toggleGrid}</div>${tableHtml}`;
}

async function loadFacilities() {
  if (!_map) return;
  _facLoaded = true;
  const l = _listing;
  clearFacilities();
  _facilityCircle = new google.maps.Circle({
    center:{lat:l.lat,lng:l.lng}, radius:500, map:_map,
    fillColor:'#4285F4',fillOpacity:0.04,strokeColor:'#4285F4',strokeOpacity:0.25,strokeWeight:1.5,
    clickable:false,
  });
  _renderFacSection(null);
  try {
    const r = await fetch(`${API}/listings/${encodeURIComponent(l.id)}/facilities`);
    if (!r.ok) { _renderFacSection([]); return; }
    const {facilities} = await r.json();
    facilities.forEach(f => {
      const color = (_facilityIconDefs[f.type]||{}).color||'#888888';
      const marker = new google.maps.Marker({
        position:{lat:f.lat,lng:f.lng}, map:_map, visible:false,
        icon:facMarkerIcon(f.type), title:f.name, zIndex:6,
      });
      marker.addListener('click', () => {
        showFacChip(color,f.name,facTypeName(f.type),f.distance_m);
        showFacRoute(f.lat,f.lng);
      });
      _facilityMarkers.push(marker);
      _facilityMarkerObjs.push({marker,facility:f,color});
    });
    _applyFacZoomVisibility();
    _renderFacSection(facilities);
  } catch { _renderFacSection([]); }
}

function _renderWalkRoute(result) {
  const pts = result.routes[0].legs[0].steps.flatMap(s=>decodePolyline(s.polyline.points));
  _facTransitLines.push(new google.maps.Polyline({
    path:pts, strokeWeight:2, strokeOpacity:0,
    icons:[{icon:{path:google.maps.SymbolPath.CIRCLE,fillColor:'#4285F4',fillOpacity:1,strokeWeight:0,scale:3.5},offset:'0',repeat:'20px'}],
    map:_map,
  }));
}

function decodePolyline(encoded) {
  const pts=[]; let i=0,lat=0,lng=0;
  while(i<encoded.length){let b,shift=0,result=0;do{b=encoded.charCodeAt(i++)-63;result|=(b&0x1f)<<shift;shift+=5;}while(b>=0x20);lat+=(result&1)?~(result>>1):(result>>1);shift=result=0;do{b=encoded.charCodeAt(i++)-63;result|=(b&0x1f)<<shift;shift+=5;}while(b>=0x20);lng+=(result&1)?~(result>>1):(result>>1);pts.push({lat:lat/1e5,lng:lng/1e5});}
  return pts;
}

function showFacRoute(facLat,facLng) {
  if (!_map||!_dirService) return;
  clearFacTransitLines();
  const key=`${_listing.id}_${facLat.toFixed(4)}_${facLng.toFixed(4)}`;
  const cached=_facRouteCache.get(key);
  if (cached) { _renderWalkRoute(cached); return; }
  _dirService.route({
    origin:{lat:_listing.lat,lng:_listing.lng},
    destination:{lat:facLat,lng:facLng},
    travelMode:google.maps.TravelMode.WALKING,region:'JP',
  },(result,status)=>{
    if (status!=='OK') return;
    _facRouteCache.set(key,result);
    _renderWalkRoute(result);
  });
}

// ── share ─────────────────────────────────────────────────────────────────────
function shareProperty() {
  if (navigator.share) { navigator.share({title:_listing?.name||'物件詳細',url:location.href}); return; }
  navigator.clipboard?.writeText(location.href).then(() => {
    const b = document.getElementById('share-btn');
    const t = b.textContent; b.textContent='✓ コピー';
    setTimeout(()=>b.textContent=t, 1500);
  });
}

// parseDetailSections() loaded from /detail-parser.js

function renderDetailSections(text) {
  let sections = [];
  try { sections = parseDetailSections(text); } catch(_) { return ''; }
  if (!sections.length) return '';
  // Sections to show as traffic/transport block (multi-line value)
  const MULTILINE = new Set(['交通', '特記事項', 'キャンペーン等', '詳細情報']);
  const rows = sections.map(s => {
    const val = MULTILINE.has(s.header)
      ? `<div class="ds-val" style="white-space:pre-line;">${esc(s.body)}</div>`
      : `<div class="ds-val">${esc(s.body)}</div>`;
    return `<div class="ds-row"><div class="ds-key">${esc(s.header)}</div>${val}</div>`;
  }).join('');
  return `<div><div class="s-label">詳細情報</div><div class="ds-table">${rows}</div></div>`;
}

boot();
</script>
